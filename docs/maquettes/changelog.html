const releases=[{"version": "v0.3.0", "title": "Arène live, Défi des empereurs et progression repensée", "body": "<h3>Nouveaux défis<\/h3><ul><li><strong>Arène live<\/strong> : affronte un autre joueur en combat manuel 4 contre 4, avec appariement par Elo et 20 secondes pour choisir une action. Sans adversaire après 30 secondes, une équipe fantôme prend le relais. Si tu ne joues pas à temps ou quittes la page, l&#x27;automatique joue pour toi ; seul un abandon volontaire donne un forfait. L&#x27;arène ne coûte pas d&#x27;énergie et récompense le classement, sans ressources d&#x27;éveil.<\/li><li><strong>Défi des empereurs<\/strong> : Shanks, Big Mom, Kaido et Barbe Blanche remplacent le boss de raid hebdomadaire. Chaque porte comporte deux vagues d&#x27;équipage puis l&#x27;empereur, en Normal, Difficile ou Cauchemar, avec un passage quotidien par empereur. Leurs mécaniques incluent sommeil, duel, dévoration, âmes et transformation en dragon.<\/li><li><strong>Hardcore<\/strong> : réunis les quatre clés d&#x27;empereur pour affronter les quatre boss ensemble. Le passage consomme les clés et rapporte des ressources légendaires et des cœurs de brèche.<\/li><li><strong>Armes légendaires<\/strong> : Griffon, Murakumogiri, Hassaikai et Napoléon, avec leurs effets propres. Elles peuvent équiper n&#x27;importe quelle carte éveillée à 5★. La forge rejoint l&#x27;Inventaire, avec un carrousel d&#x27;armes et les ressources possédées et requises.<\/li><li><strong>Trois donjons et sets<\/strong> : Attaque des Titans (Cuirasse du temps : DEF, PV, bouclier et protection à mi-vie), Demon Slayer (critique et ignore DEF) et Fairy Tail (dégâts élémentaires de feu, eau, air, terre et foudre).<\/li><li><strong>Butin de donjon progressif<\/strong> : les difficultés impaires donnent une pièce de la rareté du palier, puis une seconde de la rareté précédente à partir de la difficulté 3 ; les difficultés paires donnent une pièce et 50 % de chance d&#x27;une seconde de même rareté. Le barème va d&#x27;une pièce N en difficulté 1 à une UR et 50 % de chance d&#x27;une seconde UR en difficulté 10.<\/li><\/ul><h3>Économie, équipements et équipes<\/h3><ul><li><strong>Énergie<\/strong> : réserve de 20, régénération d&#x27;un point toutes les 2 minutes. Un combat d&#x27;histoire ou de donjon, ainsi qu&#x27;un passage chez les empereurs, coûte un point, rendu en cas de défaite.<\/li><li><strong>Ryō<\/strong> : récompenses d&#x27;histoire augmentées au premier passage et petit gain à chaque rejeu ; coût d&#x27;amélioration des artefacts divisé par deux et affiché avant de payer.<\/li><li><strong>Artefacts<\/strong> : stat principale déterminée par l&#x27;emplacement, avec la même progression entre raretés ; les sous-stats distinguent les raretés. Les artefacts UR portent le nom « Mythique ». Les objets existants sont recalculés par migration.<\/li><li><strong>Gestion de l&#x27;équipement<\/strong> : aperçu des statistiques et de leur différence avant d&#x27;équiper ou d&#x27;améliorer, filtres par stat principale, sous-stat, rareté et set, affichage des objets non équipés, recyclage contre des Ryō et jusqu&#x27;à dix sauvegardes d&#x27;équipement.<\/li><li><strong>Squads<\/strong> : favoris, filtres par rareté, type et rôle, consultation des sorts pendant le choix et échange de places par bouton ou glisser-déposer. La préparation commune reprend les squads en histoire, Tour, donjons et raids, avec une composition mémorisée par mode.<\/li><li><strong>Budget d&#x27;équipe<\/strong> : plafond de 24 hors raids ; N coûte 1, R 2, SR 3, SSR 5 et UR 8.<\/li><li><strong>Classement de puissance<\/strong> : les artefacts et l&#x27;arme équipés comptent désormais dans le score.<\/li><li><strong>Tour<\/strong> : récompense de l&#x27;étage choisi et prochains paliers visibles avant de combattre.<\/li><\/ul><h3>Éveil et histoire<\/h3><ul><li><strong>Doublon facultatif<\/strong> pour les éveils SSR et UR à 4★ et 5★ : les cœurs de brèche suffisent. Choisir de consommer un doublon divise leur coût par deux.<\/li><li><strong>Bonus à chaque étoile<\/strong> : +6 % ATK, DEF et PV par étoile ; à 2★, +25 de jauge ultime au départ ; à 3★, secondaire plus rapide ; à 4★, +10 points de critique et +20 points de dégâts critiques ; à 5★, tertiaire plus rapide, accès à l&#x27;arme et bouclier initial de 10 % des PV.<\/li><li><strong>Éveil animé et sonore<\/strong> après confirmation du succès, avec affichage stabilisé, notamment pour Gojo.<\/li><li><strong>Histoire plus progressive<\/strong> : puissance ennemie croissante entre les univers. Le suivant reste accessible après les quinze combats du précédent.<\/li><li><strong>Étoiles d&#x27;histoire<\/strong> : victoire, aucun allié à terre, puis aucun allié à terre en dix tours ou moins. Une victoire avec exactement deux personnages donne une quatrième étoile bonus indépendante. Les anciennes étoiles sont conservées ; les anciens scores de 3★ reçoivent aussi le bonus duo.<\/li><li><strong>Récompense duo<\/strong> : quinze étoiles bonus dans un univers donnent une fois quinze cristaux et 500 Ryō, séparément des paliers ordinaires.<\/li><\/ul><h3>Combat et personnages<\/h3><ul><li><strong>Combats hors de la page<\/strong> : quitter un combat PvE ne l&#x27;abandonne plus ; l&#x27;automatique le termine côté serveur. Changer simplement d&#x27;onglet ne saute plus le combat et laisse sa lecture continuer.<\/li><li><strong>Rejeu<\/strong> : bouton pour répéter un combat d&#x27;histoire ou de donjon ; effets de sorts désactivables. La première victoire d&#x27;une salle de donjon reste à jouer avec ses effets.<\/li><li><strong>Lecture plus claire<\/strong> : ordre complet des alliés et ennemis, panneau des bonus et malus avec valeurs, durées, lanceur et statistiques actualisées ; multiplicateurs des sorts visibles et aide sur les dégâts physiques et magiques.<\/li><li><strong>Équilibrage<\/strong> : la plupart des silences de zone ne touchent plus qu&#x27;un ennemi ; soin sur soi plafonné à 35 % des PV max ; une seule provocation par personnage, plus courte quand elle accompagne d&#x27;autres effets ; réductions de dégâts des sorts divisées par deux et limitées à deux tours ; soins et boucliers d&#x27;équipe des ultimes plafonnés à 20 % des PV max.<\/li><li><strong>Kits revus<\/strong> : Levi ajoute des dégâts selon les PV max de la cible ; Killua enchaîne des frappes de plus en plus fortes ; Gojo commence intouchable ; Kakashi copie le dernier ultime ; Lelouch contrôle un ennemi ; Time Leap d&#x27;Okabe donne de la jauge et retire les malus ; Mob gagne des dégâts selon les coups reçus ; Frieren devient intouchable et traverse les boucliers ; Gon prépare une frappe qui ignore la DEF.<\/li><li><strong>Catalogue<\/strong> : raretés révisées pour une partie des personnages, statistiques adaptées à leur nouvelle rareté et ajout d&#x27;Antispiral.<\/li><\/ul><h3>Interface et corrections<\/h3><ul><li><strong>Profil<\/strong> : photo choisie parmi ses personnages et vitrine recherchable dans toute la collection, y compris les basses raretés.<\/li><li><strong>Collection et navigation<\/strong> : liste des anime à gauche de la grille, titres plus compacts et barre du haut escamotable sur les grands écrans.<\/li><li><strong>Ambiance<\/strong> : nouvelles musiques d&#x27;accueil, combat, raid et PvP ; animations de navigation, cartes, forge et récompenses, avec respect des préférences de mouvement et de son.<\/li><li><strong>Succès et tutoriel<\/strong> : pastille rouge pour les récompenses à récupérer ; bouton du tutoriel pour rejoindre la page de l&#x27;étape.<\/li><li><strong>Correctifs<\/strong> : stock de cristaux actualisé après un gain, doublon d&#x27;éveil disponible même quand on en possède plusieurs, menus déroulants utilisables dans les fenêtres, synchronisation du bouton « Terminer » avec la dernière action confirmée. Atteindre la limite de tours en PvE ne donne plus une fausse victoire.<\/li><li><strong>Outils et contrôles<\/strong> : le builder conserve les nouveaux paramètres de sorts, les nouveaux statuts ont leurs effets visuels, le catalogue jetable et les assertions de la CI suivent les règles v0.3.0.<\/li><\/ul><h3>Expéditions<\/h3><ul><li><strong>Coffres Bronze, Argent, Or et Légendaire<\/strong>, avec ouverture animée et butin varié : monnaies, matériaux, énergie, artefacts, cartes et invocations offertes. Le coffre Légendaire contient un gros lot garanti.<\/li><li><strong>Résultats rééquilibrés<\/strong> selon la brèche et la puissance de l&#x27;équipe ; un triomphe rapporte un coffre supplémentaire. Les coffres restent en stock jusqu&#x27;à leur ouverture et les invocations offertes s&#x27;utilisent à la place des cristaux.<\/li><\/ul>"}, {"version": "v0.2.2", "title": "Joueurs en ligne, tutoriel plus complet et pages de connexion", "body": "<h3>Nouveautés<\/h3><ul><li><strong>Joueurs en ligne<\/strong> : un onglet « En ligne » dans le chat montre les joueurs vus depuis moins de 5 minutes, tes amis et ta guilde d&#x27;abord. Les joueurs bloqués n&#x27;y figurent pas. « Message » ouvre la conversation privée avec un ami, « Profil » ouvre la fiche des autres.<\/li><li><strong>Étoiles du mode histoire<\/strong> : le total est affiché en grand, avec une barre de progression marquée aux paliers de récompense (12, 24, 36 et 45) et le prochain objectif. Chaque combat terminé montre ses trois étoiles, plus grandes.<\/li><li><strong>Tutoriel plus explicatif<\/strong> : 28 étapes avec, pour chaque élément, une courte liste « à quoi ça sert ». Nouvelles étapes : cristaux, Ryō, bannières et taux, lot ×5 ou ×10, onglet Social, bouton JOUER, cloche, chat. Nouvelle phase « Le combat » : éléments et combos, dégâts physiques et magiques, saignement et altérations.<\/li><li><strong>Guide du jeu<\/strong> : 22 étapes, avec les ressources, les étoiles de l&#x27;histoire, les éléments et combos, physique et magique, saignement, le pilotage d&#x27;un combat et le chat.<\/li><li><strong>Fenêtres<\/strong> : un clic en dehors d&#x27;une fenêtre la ferme (squads, choix d&#x27;un compagnon, fiche personnage, fiche d&#x27;une carte, galerie).<\/li><li><strong>Connexion et inscription<\/strong> : pages remises dans le style du site.<\/li><\/ul><h3>Préparé, pas encore actif<\/h3><ul><li><strong>Mot de passe oublié et confirmation d&#x27;e-mail à l&#x27;inscription<\/strong> : le code est en place (envoi par Resend, lien de réinitialisation valable 1 heure, lien de confirmation valable 24 heures, 1 e-mail par minute et par adresse). Il ne s&#x27;active que lorsque <code>RESEND_API_KEY<\/code> et <code>EMAIL_FROM<\/code> sont définies. Sans elles, l&#x27;inscription ouvre directement la session et le lien « Mot de passe oublié ? » n&#x27;apparaît pas.<\/li><\/ul><h3>À savoir<\/h3><ul><li>Pour activer les e-mails : domaine vérifié dans Resend, puis <code>RESEND_API_KEY<\/code> et <code>EMAIL_FROM<\/code> dans Vercel (Production) et Redeploy (voir <code>docs/deploiement.md<\/code>).<\/li><li>Les cadres de cartes ne changent pas dans cette version.<\/li><\/ul>"}, {"version": "v0.2.1", "title": "Animations d'invocation, combat et corrections", "body": "<h3>Nouveautés<\/h3><ul><li><strong>Ouverture de booster<\/strong> : nouvelle invocation « graduations » (astrolabe, cadran gradué et aiguille, dans le style du dos de carte) et nouvel éclat plein écran pour les SSR et UR (« constellation encadrée »), avec leurs sons. Un clic n&#x27;importe où ou Échap passe l&#x27;animation.<\/li><li><strong>Retournement des cartes<\/strong> : nouveau son de parchemin lourd, identique pour toutes les raretés.<\/li><li><strong>Combat<\/strong> : barre de contrôle centrale (Lecture/Pause, Fin, vitesse ×1 ×2 ×4, effets et musique), sans bouton « recommencer » ni barre de progression ; en combat réel, interrupteur Auto/Manuel et « Abandonner » dessous.<\/li><li><strong>Menu mobile<\/strong> : tiroir de navigation, profil au toucher, menu Social.<\/li><li><strong>Sons<\/strong> : curseur de volume général dans les Paramètres ; les sons du booster respectent « Effets ».<\/li><li><strong>Inventaire<\/strong> : les cases d&#x27;artefact prennent la couleur de leur rareté (fond teinté, losange, reflet sur SSR et UR), y compris dans la fiche personnage.<\/li><li><strong>Profil<\/strong> : boosters ouverts, étoiles de l&#x27;histoire et étage de la Tour.<\/li><\/ul><h3>Équilibrage et corrections<\/h3><ul><li>Taux de SSR abaissé de 2,5 % à 2 % (la différence va aux cartes N).<\/li><li>La règle de la 10ᵉ invocation boostée est retirée (trop de SSR) : plus de compteur ni d&#x27;affichage.<\/li><li>« Tout révéler » ne rejoue plus l&#x27;éclat d&#x27;une SSR ou UR déjà retournée.<\/li><li>Une carte SSR ou UR ne glisse plus sous sa case à l&#x27;ouverture.<\/li><li>Éveil : la fiche se met à jour après un éveil et un double clic ne paie plus qu&#x27;une étoile.<\/li><li>Ambiance de couleur par mode et ornements d&#x27;horlogerie brisée.<\/li><li>Menu mobile : le tiroir s&#x27;ouvre de nouveau sur tout l&#x27;écran (il se réduisait à une bande de quelques pixels sur téléphone).<\/li><\/ul><h3>À savoir<\/h3><ul><li>Les cadres de cartes ne changent pas dans cette version.<\/li><\/ul>"}, {"version": "v0.2.0", "title": "Social, retours de la bêta et refonte du combat", "body": "<p>Gros lot de retours de la bêta. Les comptes existants sont conservés.<\/p><h3>Nouveautés<\/h3><ul><li><strong>Booster de bienvenue<\/strong> : un booster ×10 offert, une seule fois, avec un SSR ou un UR garanti (n&#x27;importe quel anime), mis en avant à l&#x27;ouverture.<\/li><li><strong>10ᵉ invocation boostée<\/strong> : une carte sur 10 est boostée, en ×5 comme en ×10, avec un compteur qui suit ta progression.<\/li><li><strong>Tutoriel en infobulles<\/strong> : trois actions guidées, présentation des modes et des onglets. La page « Guide du jeu » (16 étapes) est dans le menu Quêtes.<\/li><li><strong>Social<\/strong> :<\/li><\/ul><p>  - amis (demandes, blocage, statut en ligne) ;<\/p><p>  - guildes (création pour 1 000 Ryō, jusqu&#x27;à 20 membres, rôles chef, officier et membre, entrée ouverte ou sur demande) ;<\/p><p>  - chat en bas à droite de chaque page, avec trois onglets : guilde, général, privé. Limites de taille et de fréquence, filtre de mots, signalement, suppression par le chef de guilde.<\/p><ul><li><strong>Classements<\/strong> : nouveaux onglets Puissance, Histoire (étoiles) et Tour ; podium 1-2-3 ; nombre de personnages par rareté pour chaque joueur ; barre « Ton rang » fixée en bas de l&#x27;écran quand tu es hors du top 100 ; classements de guildes (collection et duels de la semaine).<\/li><li><strong>Donjons par univers<\/strong> : chaque donjon s&#x27;ouvre quand tu gagnes le combat 10 de l&#x27;histoire du même univers.<\/li><\/ul><h3>Économie et progression<\/h3><ul><li><strong>Cristaux spéciaux supprimés<\/strong> : ils sont convertis en cristaux normaux, et les bannières d&#x27;événement coûtent des cristaux normaux.<\/li><li><strong>Succès<\/strong> : cristaux normaux selon la difficulté (5 · 10 · 25 · 50), récupération manuelle avec un bouton « Récupérer » bien visible.<\/li><li><strong>Quêtes<\/strong> : uniquement quotidiennes et hebdomadaires, avec « Tout récupérer ».<\/li><li><strong>Verrous de niveau<\/strong> : Raids niveau 15, Tour universelle niveau 20, Expéditions niveau 25 ; l&#x27;Arène PvP et l&#x27;Arène Live sont marquées « pas encore disponibles ».<\/li><li><strong>Histoire<\/strong> : carte ascendante par acte, récompenses et butin sous la carte, écran de préparation « VS » avec la puissance des ennemis, composition automatique et équipe mémorisée.<\/li><\/ul><h3>Combat<\/h3><ul><li>Écran de combat aux couleurs du site (pierre sombre, or, biseaux), sans historique des tours.<\/li><li>Nouvel écran de résultat : ton équipe, la défense adverse, statistiques et étoiles (victoire, aucun allié à terre, 8 tours ou moins).<\/li><li>Musique dark fantasy à 152 BPM, effets sonores sombres et jingles courts ; sons de mort et de projectiles complétés.<\/li><li>Sorts compacts sur mobile.<\/li><\/ul><h3>Interface<\/h3><ul><li>En-tête : Ryō, cristaux, barre d&#x27;XP et accès aux paramètres ; bouton JOUER centré ; menus verrouillés grisés.<\/li><li>Boutons d&#x27;action plus visibles (fond or plus marqué, filet inférieur) ; sélecteur d&#x27;invocation ×5 gris / ×10 jaune ; emplacements de squad cliquables.<\/li><li>Avatars et emblèmes de guilde en « anneau gravé ».<\/li><li>Album : « Tous » affiche tous les personnages, possédés ou non ; filtres plus lisibles.<\/li><li>Inventaire en cases de taille égale ; collection visible sous les squads ; fiche personnage plus compacte sur téléphone.<\/li><li>Nouveau logo Anima Clash et dos de carte Anima Clash.<\/li><\/ul><h3>À savoir<\/h3><ul><li>Le chat général demande le niveau d&#x27;Arpenteur 3 pour écrire ; la liste des mots filtrés est courte et sera complétée.<\/li><li>Les signalements de messages sont enregistrés mais n&#x27;ont pas encore d&#x27;écran de traitement dans l&#x27;administration.<\/li><li>Les cadres de cartes ne changent pas dans cette version.<\/li><\/ul>"}, {"version": "v0.1.0", "title": "Première bêta", "body": "<p>Première version ouverte à quelques amis. Les comptes démarrent de zéro.<\/p><h3>Collection<\/h3><ul><li>Plus de 4 700 personnages tirés d&#x27;AniList, répartis par rareté (jusqu&#x27;à SSR et UR), avec leurs statistiques et leur type.<\/li><li>Ouverture de cristaux en 3D (1 carte par cristal), lots ×5 et ×10, finitions Holo et Gold, carte garantie et pitié sur les raretés les plus hautes.<\/li><li>Bannières spéciales et tirages de bienvenue.<\/li><li>Album : filtres par rareté, type et possession, recherche, progression globale et par rareté.<\/li><li>Fiche personnage avec description, exemplaires possédés et séries.<\/li><\/ul><h3>Combat et aventure<\/h3><ul><li>Équipe de personnages, combats animés avec bilan des dégâts en fin de combat.<\/li><li>Synergies de franchise, sorts personnalisés pour les SSR et UR, effets visuels et sonores par type.<\/li><li>Mode Histoire en univers progressifs, donjons, raids et expéditions (le jeu continue de rapporter hors ligne).<\/li><li>Artefacts, inventaire, forge et éveil pour renforcer les personnages.<\/li><\/ul><h3>Économie et social<\/h3><ul><li>Monnaie Ryō, vente rapide d&#x27;exemplaires, achat de cristaux.<\/li><li>Marché aux enchères, échanges entre joueurs, liste de souhaits et notifications.<\/li><li>Succès, quêtes, duels et classement.<\/li><\/ul><h3>Interface<\/h3><ul><li>Nouvelle identité visuelle sombre et dorée, adaptée aux téléphones.<\/li><\/ul><h3>À savoir<\/h3><ul><li>Bêta : des bugs sont possibles. Les données des joueurs seront remises à zéro à la sortie officielle, avec une sauvegarde préalable.<\/li><\/ul>"}]; const $=id=>document.getElementById(id);
function select(index){const r=releases[index];$('version-label').textContent=r.version+(index===0?' · Dernière version':'');$('release-title').textContent=r.title;$('release-notes').innerHTML=r.body;$('release-notes').scrollTop=0;document.querySelectorAll('.version').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));}
releases.forEach((r,i)=>{const b=document.createElement('button');b.className='version';b.innerHTML='<b>'+r.version+'</b><small>'+(i===0?'Dernière version':'Voir la mise à jour')+'</small>';b.addEventListener('click',()=>select(i));$('versions').append(b);});select(0);
$('welcome-title').textContent='Anima Clash '+releases[0].version;$('welcome-intro').textContent=releases[0].title;$('welcome-notes').innerHTML=releases[0].body;
function dismiss(){$('welcome').close();$('arrival').setAttribute('aria-pressed','false');$('history').setAttribute('aria-pressed','true');$('toast').textContent='Annonce lue pour cette version. L’historique reste accessible.';}
$('arrival').onclick=()=>{$('arrival').setAttribute('aria-pressed','true');$('history').setAttribute('aria-pressed','false');$('welcome').showModal();};
$('welcome').addEventListener('cancel',e=>{e.preventDefault();dismiss();});$('close').onclick=dismiss;$('read').onclick=dismiss;$('all').onclick=()=>{dismiss();select(0);$('release-title').scrollIntoView({block:'nearest'});};$('history').onclick=()=>{if($('welcome').open)dismiss();};$('nav-news').onclick=()=>{select(0);$('release-title').scrollIntoView({block:'nearest'});};
</script></body></html>
