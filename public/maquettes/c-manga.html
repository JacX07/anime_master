<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C — Shōnen pop · Anime Masters</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #ffffff; --ink: #000000; --red: #ff2e4d; --yellow: #ffd400; --blue: #1f6bff; --pink: #ff7ac2;
    --N: #c9c9c9; --R: #1f6bff; --SR: #9b4dff; --SSR: #ffd400; --UR: #ff2e4d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500;
    background: radial-gradient(circle, #00000014 1.4px, transparent 1.6px) 0 0 / 9px 9px, var(--paper); }
  .comic { font-family: "Bangers", cursive; font-weight: 400; letter-spacing: .03em; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 28px; background: var(--yellow); border-bottom: 5px solid var(--ink); }
  .logo { font-size: 34px; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--ink); text-decoration: none; font-weight: 900; padding: 6px 14px; border: 3px solid transparent; }
  nav a[aria-current] { background: var(--paper); border-color: var(--ink); transform: skew(-8deg); display: inline-block; }
  .right { margin-left: auto; display: flex; gap: 10px; }
  .btn { font: 900 14px "Zen Kaku Gothic New"; background: var(--paper); border: 3px solid var(--ink); padding: 7px 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .btn:hover { background: var(--pink); }
  .btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  main { max-width: 1140px; margin: 0 auto; padding: 28px 28px 70px; }
  /* Planche : cases de BD en diagonale */
  .page { display: grid; grid-template-columns: 1.1fr 1fr 1fr; grid-template-rows: auto auto; gap: 12px; }
  .panel { border: 5px solid var(--ink); background: var(--paper); padding: 18px; position: relative; overflow: hidden; }
  .p-mag { grid-row: span 2; background: var(--red); clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%); padding-right: 40px; display: grid; place-items: center; }
  .p-stock { clip-path: polygon(3% 0, 100% 0, 100% 100%, 0 100%); }
  .p-pity { background: var(--blue); color: var(--paper); clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%); }
  .p-last { grid-column: span 2; clip-path: polygon(2% 8%, 100% 0, 100% 100%, 0 100%); padding-top: 26px; }
  .lines { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, #0000 0 4deg, #00000022 4deg 5deg); pointer-events: none; }

  .mag { width: 220px; aspect-ratio: 3/4; background: var(--yellow); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); position: relative; cursor: pointer; transform: rotate(-4deg); transition: transform .2s; padding: 12px; text-align: left; font: inherit; color: var(--ink); }
  .mag:hover { transform: rotate(0) scale(1.05); }
  .mag:focus-visible { outline: 5px solid var(--blue); outline-offset: 6px; }
  .mag .t { position: absolute; left: 12px; right: 60px; top: 14px; font-family: "Bangers"; font-size: 40px; line-height: .9; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .mag .n { position: absolute; right: 10px; top: 10px; background: var(--ink); color: var(--yellow); font-weight: 900; padding: 2px 8px; }
  .mag .cover { position: absolute; left: 12px; right: 12px; bottom: 44px; top: 96px; background: url(https://s4.anilist.co/file/anilistcdn/character/large/b40-MNypXsxSRb1R.png) top / cover; border: 4px solid var(--ink); }
  .mag .go { position: absolute; left: 12px; right: 12px; bottom: 10px; font-weight: 900; text-align: center; }
  .mag.open { animation: slam .45s ease-in forwards; }
  @keyframes slam { 50% { transform: rotate(8deg) scale(1.15); } to { transform: rotate(20deg) scale(.1); opacity: 0; } }

  .big { font-family: "Bangers"; font-size: 72px; line-height: .9; }
  .big small { font: 900 16px "Zen Kaku Gothic New"; display: block; }
  .bubble { margin-top: 12px; display: inline-block; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 6px 12px; font-weight: 900; position: relative; }
  .bubble::after { content: ""; position: absolute; left: 22px; bottom: -14px; border: 7px solid transparent; border-top-color: var(--ink); }
  .p-pity h2 { margin: 0 0 10px; font-family: "Bangers"; font-weight: 400; font-size: 30px; color: var(--yellow); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
  .meter { margin-bottom: 12px; font-weight: 900; }
  .meter div { height: 18px; border: 3px solid var(--ink); background: var(--paper); margin-top: 4px; }
  .meter span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 9px); }
  .p-last h2 { margin: 0 0 10px; font-weight: 900; font-size: 18px; }
  .strip { display: flex; gap: 10px; }
  .strip i { width: 70px; height: 90px; border: 4px solid var(--ink); background-size: cover; background-position: top; transform: rotate(var(--r)); }

  .tray { margin-top: 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); justify-content: center; gap: 20px; perspective: 1000px; min-height: 280px; }
  .empty { grid-column: 1/-1; align-self: center; text-align: center; font-weight: 900; }
  .slot { position: relative; cursor: pointer; animation: smash .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--i) * 80ms); }
  @keyframes smash { from { transform: scale(1.8) rotate(10deg); opacity: 0; } }
  .flipper { position: relative; aspect-ratio: 5/7; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.5,.5,1); }
  .slot.revealed .flipper { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; }
  .back { border: 5px solid var(--ink); background: radial-gradient(circle, var(--ink) 2px, transparent 2.5px) 0 0 / 10px 10px, var(--yellow); display: grid; place-items: center; box-shadow: 6px 6px 0 var(--ink); }
  .back::after { content: "!?"; font-family: "Bangers"; font-size: 72px; color: var(--red); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .slot:not(.revealed):hover .back { animation: shake .25s linear infinite; }
  @keyframes shake { 25% { translate: -3px 1px; } 75% { translate: 3px -1px; } }
  .front { transform: rotateY(180deg); }

  .card { --c: var(--N); position: relative; height: 100%; border: 5px solid var(--ink); background: var(--paper); box-shadow: 6px 6px 0 var(--ink); overflow: hidden;
    transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)); transition: transform .12s, box-shadow .15s; }
  .card:hover { box-shadow: 10px 10px 0 var(--c), 14px 14px 0 var(--ink); }
  .card[data-r="R"] { --c: var(--R); } .card[data-r="SR"] { --c: var(--SR); } .card[data-r="SSR"] { --c: var(--SSR); } .card[data-r="UR"] { --c: var(--UR); }
  .card img { position: absolute; inset: 0 0 26% 0; width: 100%; height: 74%; object-fit: cover; object-position: top; }
  .card .speed { position: absolute; inset: -40%; background: repeating-conic-gradient(#0000 0 3deg, #ffffffcc 3deg 4deg); opacity: 0; transition: opacity .15s; mask: radial-gradient(circle, transparent 25%, #000 60%); }
  .card:hover .speed { opacity: 1; }
  .rar { position: absolute; top: -4px; left: -4px; background: var(--c); border: 4px solid var(--ink); padding: 0 10px; font-family: "Bangers"; font-size: 22px; color: var(--paper); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
  .ser { position: absolute; top: 6px; right: 6px; background: var(--paper); border: 3px solid var(--ink); font-weight: 900; font-size: 12px; padding: 0 6px; }
  .cap { position: absolute; inset: auto 0 0 0; height: 26%; border-top: 5px solid var(--ink); background: var(--paper); padding: 6px 10px; display: flex; flex-direction: column; }
  .cap strong { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .row { margin-top: auto; display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; }
  .card[data-f="HOLO"] img { filter: saturate(1.4); }
  .card[data-f="HOLO"]::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, #ff7ac266 45%, #ffd40066 55%, #1f6bff55 65%, transparent 80%); background-size: 250% 250%; background-position: var(--mx, 0%) var(--my, 0%); mix-blend-mode: color-dodge; pointer-events: none; }
  .sfx { position: absolute; z-index: 5; left: 50%; top: 40%; font-family: "Bangers"; font-size: 70px; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; pointer-events: none; animation: sfx 1s ease-out forwards; }
  @keyframes sfx { from { transform: translate(-50%, -50%) scale(.2) rotate(-20deg); } 30% { transform: translate(-50%, -50%) scale(1.3) rotate(-10deg); } to { transform: translate(-50%, -80%) scale(1.1) rotate(-10deg); opacity: 0; } }
  .shake { animation: screen .35s linear; }
  @keyframes screen { 20% { translate: -8px 4px; } 40% { translate: 7px -5px; } 60% { translate: -5px -3px; } 80% { translate: 4px 4px; } }
  .actions { text-align: center; margin-top: 22px; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } .p-mag, .p-last { grid-row: auto; grid-column: auto; } .tray { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo comic">Anime Masters</div>
  <nav><a href="#" aria-current="page">Paquets</a><a href="#">Album</a><a href="#">Classement</a></nav>
  <div class="right"><button class="btn" id="snd" aria-pressed="true">🔊 Son activé</button><span class="btn">Mika</span></div>
</header>
<main id="main">
  <section class="page">
    <div class="panel p-mag"><div class="lines"></div>
      <button class="mag" id="mag" aria-label="Ouvrir le numéro"><span class="n">N°9</span><span class="t">Hebdo Masters</span><span class="cover"></span><span class="go">Ouvre-moi !</span></button>
    </div>
    <div class="panel p-stock">
      <p class="big comic">9 / 10<small>numéros en stock</small></p>
      <span class="bubble">Le prochain sort dans 4:12</span>
    </div>
    <div class="panel p-pity">
      <h2>Garanties</h2>
      <div class="meter">SSR dans 6 numéros<div><span style="--c:var(--yellow);width:60%"></span></div></div>
      <div class="meter">UR dans 71 numéros<div><span style="--c:var(--red);width:29%"></span></div></div>
    </div>
    <div class="panel p-last">
      <h2>Tes meilleures prises de la semaine</h2>
      <div class="strip">
        <i style="--r:-3deg;background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b71-1W4panC53vfs.png)"></i>
        <i style="--r:2deg;background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b89361-tq8PQQ4MmF0M.png)"></i>
        <i style="--r:-1deg;background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b45627-CR68RyZmddGG.png)"></i>
      </div>
    </div>
  </section>
  <section class="tray" id="tray"><p class="empty">Ouvre le numéro : 5 cartes vont surgir ici.</p></section>
  <div class="actions" id="actions" hidden><button class="btn" id="all">Tout révéler</button></div>
</main>
<script src="shared.js"></script>
<script>
  Sound.profile = "manga";
  soundToggle(document.getElementById("snd"));
  const card = (c) => `<article class="card" data-tilt data-r="${c.rarity}" data-f="${c.finish || "NORMAL"}"><div class="speed"></div>
    <img src="${c.img}" alt="${c.name}"><span class="rar">${c.rarity}</span><span class="ser">#${c.serial}</span>
    <div class="cap"><strong>${c.name}</strong><div class="row"><span>${TYPES[c.type][0]} ${c.series}</span></div><div class="row"><span>⚔️ ${c.atk}</span><span>🛡️ ${c.def}</span></div></div></article>`;
  const mag = document.getElementById("mag"), tray = document.getElementById("tray"), main = document.getElementById("main");
  mag.addEventListener("click", () => {
    mag.classList.add("open");
    setTimeout(() => {
      openPack(tray, card, { onUR: (slot) => {
        const s = document.createElement("div"); s.className = "sfx"; s.textContent = "ドン!"; slot.appendChild(s);
        main.classList.remove("shake"); void main.offsetWidth; main.classList.add("shake");
      } });
      document.getElementById("actions").hidden = false;
      setTimeout(() => mag.classList.remove("open"), 1500);
    }, 350);
  });
  document.getElementById("all").addEventListener("click", () => revealAll(tray));
</script>
</body>
</html>
