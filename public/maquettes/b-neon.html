<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B — Néon arcade · Anime Masters</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --violet: #3b1a8f; --plum: #7a1fa2; --pink: #ff4fd8; --cyan: #3cf2ff; --volt: #f5ff4a; --white: #ffffff;
    --N: #b9c2ff; --R: #3cf2ff; --SR: #c77dff; --SSR: #ffb020; --UR: #ff4fd8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--white); font-family: "Rubik", sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #b44cff 0%, transparent 55%), linear-gradient(180deg, var(--violet) 0%, var(--plum) 70%, #c2297e 100%); overflow-x: hidden; }
  .sign { font-family: "Bungee", sans-serif; font-weight: 400; }
  /* Sol en grille rétro, en perspective */
  body::after { content: ""; position: fixed; left: -50%; right: -50%; bottom: -10vh; height: 55vh; z-index: -1;
    background: linear-gradient(#ff4fd8aa 2px, transparent 2px) 0 0 / 80px 80px, linear-gradient(90deg, #ff4fd8aa 2px, transparent 2px) 0 0 / 80px 80px;
    transform: perspective(500px) rotateX(62deg); mask: linear-gradient(transparent, #000 40%); animation: grid 3s linear infinite; }
  @keyframes grid { to { background-position: 0 80px, 0 0; } }

  header { display: flex; align-items: center; gap: 28px; padding: 18px 32px; }
  .logo { font-size: 24px; color: var(--volt); text-shadow: 0 0 6px var(--volt), 0 0 22px #f5ff4a99; }
  nav { display: flex; gap: 6px; }
  nav a { color: #ffffffcc; text-decoration: none; font-weight: 800; padding: 8px 14px; border-radius: 10px; }
  nav a[aria-current] { color: var(--white); background: #ffffff1f; box-shadow: inset 0 -3px 0 var(--cyan); }
  nav a:hover { color: var(--cyan); }
  .right { margin-left: auto; display: flex; gap: 10px; }
  .btn { font: 800 14px "Rubik"; color: var(--white); background: #ffffff1a; border: 2px solid #ffffff55; border-radius: 12px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 14px #3cf2ff88; }
  .btn:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

  main { max-width: 1160px; margin: 0 auto; padding: 10px 32px 80px; }
  .stage { display: grid; grid-template-columns: 1fr 360px; gap: 36px; align-items: center; }

  /* Booster à déchirer */
  .booster-zone { display: grid; justify-items: center; gap: 18px; }
  .booster { width: 230px; aspect-ratio: 3/4.4; border-radius: 16px; position: relative; cursor: pointer; border: 0; padding: 0;
    background: conic-gradient(from var(--a, 0deg) at 50% 50%, #ff4fd8, #3cf2ff, #f5ff4a, #c77dff, #ff4fd8);
    box-shadow: 0 0 40px #ff4fd8aa, 0 30px 60px #0006; transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)); transition: transform .15s; animation: float 3s ease-in-out infinite, hue 6s linear infinite; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes hue { to { --a: 360deg; } }
  @keyframes float { 50% { translate: 0 -10px; } }
  .booster::before { content: ""; position: absolute; inset: 10px; border-radius: 10px; background: linear-gradient(160deg, #2a0f6bdd, #5b0f7add); }
  .booster span { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; }
  .booster b { font-family: "Bungee"; font-weight: 400; font-size: 30px; line-height: 1; color: var(--volt); text-shadow: 0 0 10px var(--volt); }
  .booster small { font-weight: 800; letter-spacing: .02em; color: var(--white); }
  .booster::after { content: ""; position: absolute; left: 0; right: 0; top: 18%; height: 0; border-top: 3px dashed #ffffffaa; }
  .booster.torn { animation: tear .5s ease-in forwards; }
  @keyframes tear { 40% { transform: scale(1.08) rotate(-3deg); filter: brightness(2); } to { transform: scale(.2) rotate(20deg); opacity: 0; } }
  .booster:focus-visible { outline: 3px solid var(--volt); outline-offset: 6px; }
  .cta { font-weight: 800; color: var(--cyan); text-shadow: 0 0 8px #3cf2ff; }

  .hud { background: #1c0b4acc; border: 2px solid #ffffff2a; border-radius: 20px; padding: 22px; display: grid; gap: 20px; backdrop-filter: blur(8px); box-shadow: 0 0 0 1px #ff4fd855, 0 20px 50px #0005; }
  .hud h2 { margin: 0; font-family: "Bungee"; font-weight: 400; font-size: 18px; color: var(--cyan); }
  .stock { display: flex; gap: 6px; }
  .stock i { flex: 1; height: 34px; border-radius: 6px; background: #ffffff18; }
  .stock i.on { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  .big { font-family: "Bungee"; font-size: 44px; line-height: 1; }
  .big small { font: 600 15px "Rubik"; color: #ffffffbb; }
  .leds p { margin: 0 0 6px; font-weight: 600; display: flex; justify-content: space-between; }
  .leds p b { color: var(--volt); }
  .bar { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
  .bar i { height: 12px; border-radius: 3px; background: #ffffff18; }
  .bar i.on { background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* Cartes */
  .tray { margin-top: 44px; display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); justify-content: center; gap: 22px; perspective: 1100px; min-height: 280px; }
  .empty { grid-column: 1 / -1; text-align: center; align-self: center; color: #ffffffaa; font-weight: 600; }
  .slot { position: relative; cursor: pointer; animation: rise .6s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i) * 110ms); }
  @keyframes rise { from { transform: translateY(80px) scale(.7); opacity: 0; filter: brightness(3); } }
  .flipper { position: relative; aspect-ratio: 5/7; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,1.2,.3,1); }
  .slot.revealed .flipper { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; }
  .back { background: repeating-linear-gradient(45deg, #ffffff10 0 8px, transparent 8px 16px), linear-gradient(160deg, #4b1aa8, #a1197c); border: 2px solid #ffffff44; box-shadow: 0 0 20px #ff4fd866; display: grid; place-items: center; transition: transform .2s, box-shadow .2s; }
  .back::after { content: "AM"; font-family: "Bungee"; font-size: 34px; color: #ffffffcc; text-shadow: 0 0 12px var(--cyan); }
  .slot:not(.revealed):hover .back { transform: translateY(-8px); box-shadow: 0 0 34px var(--cyan); }
  .front { transform: rotateY(180deg); }

  .card { --c: var(--N); position: relative; height: 100%; border-radius: 14px; padding: 3px; overflow: hidden;
    background: linear-gradient(135deg, var(--c), #ffffff, var(--c)); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 70%, transparent);
    transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)) scale(1); transition: transform .12s, box-shadow .2s; }
  .card:hover { transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)) scale(1.06); box-shadow: 0 0 36px var(--c), 0 24px 40px #0007; z-index: 2; }
  .card[data-r="R"] { --c: var(--R); } .card[data-r="SR"] { --c: var(--SR); } .card[data-r="SSR"] { --c: var(--SSR); } .card[data-r="UR"] { --c: var(--UR); }
  .card[data-r="UR"] { background: conic-gradient(from var(--a), #ff4fd8, #3cf2ff, #f5ff4a, #c77dff, #ff4fd8); animation: hue 2.5s linear infinite; }
  .inner { position: relative; height: 100%; border-radius: 11px; overflow: hidden; background: #1c0b4a; }
  .inner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .glare { position: absolute; inset: 0; background: radial-gradient(circle at var(--mx, 50%) var(--my, 40%), #ffffff88, transparent 40%), linear-gradient(115deg, transparent 30%, #ff4fd844 45%, #3cf2ff44 55%, transparent 70%); background-size: 100% 100%, 250% 250%; background-position: 0 0, var(--mx, 0%) var(--my, 0%); mix-blend-mode: overlay; opacity: 0; transition: opacity .2s; }
  .card:hover .glare, .card[data-f="HOLO"] .glare { opacity: 1; }
  .rar { position: absolute; top: 8px; left: 8px; font-family: "Bungee"; font-size: 16px; color: var(--c); text-shadow: 0 0 8px var(--c), 0 2px 0 #000a; }
  .ser { position: absolute; top: 9px; right: 9px; font-weight: 800; font-size: 12px; background: #000a; border-radius: 6px; padding: 2px 6px; }
  .info { position: absolute; inset: auto 0 0 0; padding: 40px 10px 9px; background: linear-gradient(transparent, #1c0b4af0 45%); }
  .info strong { display: block; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info em { display: block; font-style: normal; font-size: 12px; color: #ffffffaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; justify-content: space-between; margin-top: 6px; font-weight: 800; font-size: 13px; }
  .rays { position: absolute; inset: -60%; z-index: -1; pointer-events: none; background: repeating-conic-gradient(#ff4fd855 0 6deg, transparent 6deg 18deg); mask: radial-gradient(circle, #000 20%, transparent 60%); animation: rays 6s linear infinite; }
  @keyframes rays { to { rotate: 360deg; } }
  .actions { text-align: center; margin-top: 24px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } .tray { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { *, body::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo sign">Anime Masters</div>
  <nav><a href="#" aria-current="page">Paquets</a><a href="#">Album</a><a href="#">Classement</a></nav>
  <div class="right"><button class="btn" id="snd" aria-pressed="true">🔊 Son activé</button><span class="btn">Mika</span></div>
</header>
<main>
  <section class="stage">
    <div class="booster-zone">
      <button class="booster" id="booster" data-tilt aria-label="Déchirer le booster pour l'ouvrir"><span><b>BOOSTER</b><small>5 cartes · 1 R ou mieux</small></span></button>
      <p class="cta">Clique pour déchirer</p>
    </div>
    <aside class="hud">
      <div>
        <h2>Stock</h2>
        <p class="big">9<small> / 10 boosters</small></p>
        <div class="stock" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
        <p style="margin:10px 0 0;color:#ffffffbb">Prochain booster dans <b style="color:var(--volt)">4:12</b></p>
      </div>
      <div class="leds">
        <p>SSR garanti <span>dans <b>6</b></span></p>
        <div class="bar" style="--c:var(--SSR)" id="ssr"></div>
      </div>
      <div class="leds">
        <p>UR garanti <span>dans <b>71</b></span></p>
        <div class="bar" style="--c:var(--UR)" id="ur"></div>
      </div>
    </aside>
  </section>
  <section class="tray" id="tray"><p class="empty">Tes 5 cartes apparaîtront ici.</p></section>
  <div class="actions" id="actions" hidden><button class="btn" id="all">Tout révéler</button></div>
</main>
<script src="shared.js"></script>
<script>
  Sound.profile = "neon";
  soundToggle(document.getElementById("snd"));
  const leds = (el, on) => { el.innerHTML = Array.from({ length: 15 }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join(""); };
  leds(document.getElementById("ssr"), 9); leds(document.getElementById("ur"), 4);
  enableTilt();
  const card = (c) => `<article class="card" data-tilt data-r="${c.rarity}" data-f="${c.finish || "NORMAL"}"><div class="inner">
    <img src="${c.img}" alt="${c.name}"><div class="glare"></div><span class="rar">${c.rarity}</span><span class="ser">#${c.serial}</span>
    <div class="info"><strong>${c.name}</strong><em>${TYPES[c.type][0]} ${c.series}</em><div class="stats"><span>⚔️ ${c.atk}</span><span>🛡️ ${c.def}</span></div></div></div></article>`;
  const booster = document.getElementById("booster"), tray = document.getElementById("tray");
  booster.addEventListener("click", () => {
    booster.classList.add("torn");
    setTimeout(() => {
      openPack(tray, card, { onUR: (slot) => { const r = document.createElement("div"); r.className = "rays"; slot.prepend(r); } });
      document.getElementById("actions").hidden = false;
      setTimeout(() => booster.classList.remove("torn"), 1500);
    }, 380);
  });
  document.getElementById("all").addEventListener("click", () => revealAll(tray));
</script>
</body>
</html>
