<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D — Rêve holo · Anime Masters</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --peach: #ffd6c9; --lilac: #d9c8ff; --mint: #c6f5e6; --sky: #c9e4ff; --deep: #4a3a8c; --rose: #ff7eb6;
    --N: #b8bfd6; --R: #6cc4ff; --SR: #b38bff; --SSR: #ffb86b; --UR: #ff7eb6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--deep); font-family: "Zen Maru Gothic", sans-serif; font-weight: 500;
    background: radial-gradient(at 15% 20%, var(--peach) 0, transparent 45%), radial-gradient(at 85% 10%, var(--sky) 0, transparent 45%),
      radial-gradient(at 70% 80%, var(--mint) 0, transparent 50%), radial-gradient(at 20% 90%, var(--lilac) 0, transparent 50%), #f3eaff; }
  .round { font-family: "Fredoka", sans-serif; }
  header { display: flex; align-items: center; gap: 26px; padding: 18px 30px; }
  .logo { font-size: 26px; font-weight: 700; background: linear-gradient(90deg, var(--rose), #8b6bff, #3fb8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  nav { display: flex; gap: 6px; padding: 5px; background: #ffffff80; border-radius: 999px; backdrop-filter: blur(10px); }
  nav a { color: var(--deep); text-decoration: none; font-weight: 700; padding: 7px 16px; border-radius: 999px; }
  nav a[aria-current] { background: #fff; box-shadow: 0 4px 14px #8b6bff33; }
  .right { margin-left: auto; display: flex; gap: 10px; }
  .btn { font: 700 14px "Zen Maru Gothic"; color: var(--deep); background: #ffffffb0; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; box-shadow: 0 4px 14px #8b6bff22; }
  .btn:hover { background: #fff; }
  .btn:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

  main { max-width: 1120px; margin: 0 auto; padding: 14px 30px 70px; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .glass { background: #ffffff8c; border: 1.5px solid #ffffffcc; border-radius: 32px; padding: 26px; backdrop-filter: blur(16px); box-shadow: 0 20px 50px #8b6bff22; }
  .crystal-zone { display: grid; justify-items: center; align-content: center; gap: 10px; min-height: 330px; }
  .crystal { width: 170px; height: 170px; border: 0; cursor: pointer; clip-path: polygon(50% 0, 100% 38%, 80% 100%, 20% 100%, 0 38%);
    background: conic-gradient(from var(--a, 0deg), #ffb3d9, #b3e5ff, #d4ffe8, #e5ccff, #ffe4b3, #ffb3d9); animation: hue 5s linear infinite, bob 3s ease-in-out infinite; filter: drop-shadow(0 12px 30px #ff7eb6aa); transition: scale .2s; }
  .crystal:hover { scale: 1.08; }
  .crystal:focus-visible { outline: 3px solid var(--deep); }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes hue { to { --a: 360deg; } }
  @keyframes bob { 50% { translate: 0 -12px; } }
  .crystal.pop { animation: shatter .5s ease-in forwards; }
  @keyframes shatter { 40% { scale: 1.25; filter: brightness(1.8) drop-shadow(0 0 40px #fff); } to { scale: 2; opacity: 0; } }
  .crystal-zone h1 { margin: 6px 0 0; font-family: "Fredoka"; font-weight: 600; font-size: 28px; }
  .crystal-zone p { margin: 0; }

  .side { display: grid; gap: 18px; align-content: start; }
  .stock { display: flex; align-items: baseline; gap: 10px; }
  .stock b { font-family: "Fredoka"; font-size: 56px; line-height: 1; font-weight: 700; }
  .orbs { display: flex; gap: 8px; margin-top: 8px; }
  .orbs i { width: 22px; height: 22px; border-radius: 50%; background: #ffffffaa; box-shadow: inset 0 0 0 2px #fff; }
  .orbs i.on { background: radial-gradient(circle at 35% 30%, #fff, var(--rose) 60%); box-shadow: 0 0 10px #ff7eb688; }
  .ring-row { display: flex; gap: 22px; }
  .ring { display: flex; align-items: center; gap: 12px; }
  .ring svg { width: 64px; height: 64px; rotate: -90deg; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: #ffffffaa; }
  .ring .fg { stroke: var(--c); stroke-linecap: round; stroke-dasharray: 170; }
  .ring b { font-family: "Fredoka"; font-size: 20px; display: block; }
  .last { display: flex; gap: 10px; }
  .last i { width: 56px; height: 56px; border-radius: 18px; background-size: cover; background-position: top; box-shadow: 0 6px 16px #8b6bff33; border: 3px solid #fff; }

  .tray { margin-top: 36px; display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); justify-content: center; gap: 22px; perspective: 1000px; min-height: 280px; }
  .empty { grid-column: 1/-1; align-self: center; text-align: center; font-weight: 700; opacity: .7; }
  .slot { position: relative; cursor: pointer; animation: float-in .8s cubic-bezier(.2,1,.3,1) both; animation-delay: calc(var(--i) * 120ms); }
  @keyframes float-in { from { transform: translateY(40px) scale(.85); opacity: 0; filter: blur(8px); } }
  .flipper { position: relative; aspect-ratio: 5/7; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,1,.3,1); }
  .slot.revealed .flipper { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; }
  .back { background: linear-gradient(135deg, #ffd6e8, #d9c8ff, #c6f0ff); border: 3px solid #fff; box-shadow: 0 14px 30px #8b6bff33; display: grid; place-items: center; transition: transform .25s; }
  .back::after { content: "✦"; font-size: 54px; color: #fff; text-shadow: 0 0 20px #ff7eb6; }
  .slot:not(.revealed):hover .back { transform: translateY(-8px) rotate(1deg); }
  .front { transform: rotateY(180deg); }

  .card { --c: var(--N); position: relative; height: 100%; border-radius: 22px; padding: 5px; background: linear-gradient(140deg, #fff, var(--c), #fff); box-shadow: 0 14px 30px color-mix(in srgb, var(--c) 45%, transparent);
    transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)); transition: transform .15s, box-shadow .25s; }
  .card:hover { box-shadow: 0 22px 44px color-mix(in srgb, var(--c) 70%, transparent); }
  .card[data-r="R"] { --c: var(--R); } .card[data-r="SR"] { --c: var(--SR); } .card[data-r="SSR"] { --c: var(--SSR); } .card[data-r="UR"] { --c: var(--UR); }
  .card[data-r="UR"] { background: conic-gradient(from var(--a), #ffb3d9, #b3e5ff, #d4ffe8, #e5ccff, #ffe4b3, #ffb3d9); animation: hue 3s linear infinite; }
  .inner { position: relative; height: 100%; border-radius: 18px; overflow: hidden; background: #fff; }
  .inner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .sheen { position: absolute; inset: 0; background: radial-gradient(circle at var(--mx, 50%) var(--my, 40%), #ffffffaa, transparent 35%); opacity: 0; transition: opacity .25s; }
  .card:hover .sheen, .card[data-f="HOLO"] .sheen { opacity: 1; }
  .card[data-f="HOLO"] .inner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 25%, #ffb3d977 40%, #b3e5ff77 50%, #d4ffe877 60%, transparent 75%); background-size: 250% 250%; background-position: var(--mx, 0%) var(--my, 0%); mix-blend-mode: color-dodge; }
  .rar { position: absolute; top: 8px; left: 8px; background: #ffffffd0; border-radius: 999px; padding: 2px 10px; font-family: "Fredoka"; font-weight: 700; font-size: 14px; color: color-mix(in srgb, var(--c) 70%, var(--deep)); }
  .ser { position: absolute; top: 8px; right: 8px; background: #ffffffd0; border-radius: 999px; padding: 2px 8px; font-weight: 700; font-size: 12px; }
  .info { position: absolute; inset: auto 6px 6px 6px; padding: 8px 10px; border-radius: 14px; background: #ffffffd9; backdrop-filter: blur(8px); }
  .info strong { display: block; font-family: "Fredoka"; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info em { display: block; font-style: normal; font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .row { display: flex; justify-content: space-between; margin-top: 4px; font-weight: 700; font-size: 13px; }
  .spark { position: fixed; pointer-events: none; z-index: 10; font-size: 14px; color: #fff; text-shadow: 0 0 8px var(--rose); animation: spark .7s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(90deg); opacity: 0; } }
  .halo { position: absolute; inset: -30px; z-index: -1; border-radius: 50%; background: radial-gradient(circle, #ffffffee, #ff7eb655 40%, transparent 70%); animation: halo 1.4s ease-out; }
  @keyframes halo { from { scale: .2; } }
  .actions { text-align: center; margin-top: 22px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } .tray { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo round">Anime Masters</div>
  <nav><a href="#" aria-current="page">Paquets</a><a href="#">Album</a><a href="#">Classement</a></nav>
  <div class="right"><button class="btn" id="snd" aria-pressed="true">🔊 Son activé</button><span class="btn">Mika</span></div>
</header>
<main>
  <section class="stage">
    <div class="glass crystal-zone">
      <button class="crystal" id="crystal" aria-label="Ouvrir le cristal"></button>
      <h1>Un cristal t'attend</h1>
      <p>Touche-le pour libérer 5 cartes.</p>
    </div>
    <div class="glass side">
      <div>
        <div class="stock"><b>9</b><span>cristaux sur 10</span></div>
        <div class="orbs" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
        <p style="margin:10px 0 0">Le prochain se forme dans <b>4:12</b></p>
      </div>
      <div class="ring-row">
        <div class="ring" style="--c:var(--SSR)"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" style="stroke-dashoffset:68"/></svg><div><b>6</b>avant un SSR</div></div>
        <div class="ring" style="--c:var(--UR)"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" style="stroke-dashoffset:121"/></svg><div><b>71</b>avant un UR</div></div>
      </div>
      <div>
        <p style="margin:0 0 8px;font-weight:700">Tes dernières trouvailles</p>
        <div class="last">
          <i style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b40-MNypXsxSRb1R.png)"></i>
          <i style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b71-1W4panC53vfs.png)"></i>
          <i style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b89361-tq8PQQ4MmF0M.png)"></i>
        </div>
      </div>
    </div>
  </section>
  <section class="tray" id="tray"><p class="empty">Tes cartes flotteront ici.</p></section>
  <div class="actions" id="actions" hidden><button class="btn" id="all">Tout révéler</button></div>
</main>
<script src="shared.js"></script>
<script>
  Sound.profile = "dream";
  soundToggle(document.getElementById("snd"));
  const card = (c) => `<article class="card" data-tilt data-r="${c.rarity}" data-f="${c.finish || "NORMAL"}"><div class="inner">
    <img src="${c.img}" alt="${c.name}"><div class="sheen"></div><span class="rar">${c.rarity}</span><span class="ser">#${c.serial}</span>
    <div class="info"><strong>${c.name}</strong><em>${TYPES[c.type][0]} ${c.series}</em><div class="row"><span>⚔️ ${c.atk}</span><span>🛡️ ${c.def}</span></div></div></div></article>`;
  const crystal = document.getElementById("crystal"), tray = document.getElementById("tray");
  crystal.addEventListener("click", () => {
    crystal.classList.add("pop");
    setTimeout(() => {
      openPack(tray, card, { onUR: (slot) => { const h = document.createElement("div"); h.className = "halo"; slot.prepend(h); } });
      document.getElementById("actions").hidden = false;
      setTimeout(() => crystal.classList.remove("pop"), 1500);
    }, 380);
  });
  document.getElementById("all").addEventListener("click", () => revealAll(tray));
  // Étincelles au survol des cartes retournées
  let last = 0;
  tray.addEventListener("pointermove", (e) => {
    if (!e.target.closest(".revealed") || Date.now() - last < 60 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    last = Date.now();
    const s = document.createElement("span");
    s.className = "spark"; s.textContent = "✦";
    s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
    s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px"); s.style.setProperty("--dy", (-20 - Math.random() * 40) + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  });
</script>
</body>
</html>
