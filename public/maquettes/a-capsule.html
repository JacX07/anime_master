<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A — Capsule · Anime Masters</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --sky: #cdebff; --ink: #2b1b5a; --gum: #ff5fa8; --lemon: #ffdf3d; --mint: #35d6a0; --grape: #7c5cff; --white: #ffffff;
    --N: #9aa6c4; --R: #3fb6ff; --SR: #a26bff; --SSR: #ff9f1c; --UR: #ff4f8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 500;
    background: radial-gradient(circle, #ffffffaa 9px, transparent 10px) 0 0 / 56px 56px, var(--sky);
    min-height: 100vh;
  }
  .display { font-family: "Dela Gothic One", sans-serif; font-weight: 400; letter-spacing: 0.01em; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 28px; }
  .logo { font-size: 26px; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); background: linear-gradient(var(--gum) 50%, var(--white) 50%); box-shadow: 3px 3px 0 var(--ink); }
  nav { margin-left: 24px; display: flex; gap: 8px; }
  nav a { padding: 8px 16px; border-radius: 999px; font-weight: 800; color: var(--ink); text-decoration: none; border: 3px solid transparent; }
  nav a[aria-current] { background: var(--white); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  nav a:hover:not([aria-current]) { background: #ffffff80; }
  .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--white); border: 3px solid var(--ink); font-weight: 800; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; font: inherit; font-weight: 800; color: inherit; }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 28px 60px; }
  .stage { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: stretch; }
  .panel { background: var(--white); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 8px 8px 0 var(--ink); padding: 22px; }

  /* Distributeur de capsules */
  .machine { position: relative; display: grid; justify-items: center; gap: 0; padding-top: 26px; background: var(--gum); }
  .globe { width: 230px; height: 230px; border-radius: 50%; border: 4px solid var(--ink); background: radial-gradient(circle at 30% 25%, #fff 0 12%, #ffffff55 13% 22%, transparent 23%), #e8f6ff; position: relative; overflow: hidden; }
  .cap { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); background: linear-gradient(var(--c) 50%, #fff 50%); }
  .base { width: 270px; margin-top: -8px; background: var(--lemon); border: 4px solid var(--ink); border-radius: 22px 22px 18px 18px; padding: 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
  .count { font-size: 46px; line-height: 1; }
  .count small { font-family: "M PLUS Rounded 1c"; font-size: 15px; font-weight: 800; display: block; margin-top: 4px; }
  .knob { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); background: var(--white); cursor: pointer; position: relative; box-shadow: 4px 4px 0 var(--ink); transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .knob::before { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 16px; margin-left: -8px; border-radius: 8px; background: var(--grape); border: 3px solid var(--ink); }
  .knob:hover { transform: rotate(-20deg) scale(1.05); }
  .knob.turn { transform: rotate(360deg); }
  .knob:focus-visible { outline: 4px solid var(--grape); outline-offset: 4px; }
  .hint { font-weight: 800; font-size: 14px; margin-top: 10px; color: var(--white); text-shadow: 2px 2px 0 var(--ink); }

  .info { display: grid; align-content: start; gap: 22px; }
  .info h1 { margin: 0; font-size: 34px; line-height: 1.1; }
  .timer { font-weight: 800; font-size: 17px; }
  .timer b { background: var(--lemon); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 8px; }
  .pity { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .gauge { border: 3px solid var(--ink); border-radius: 18px; padding: 12px 14px; background: #f3f0ff; }
  .gauge p { margin: 0 0 8px; font-weight: 800; }
  .tube { height: 22px; border: 3px solid var(--ink); border-radius: 999px; background: var(--white); overflow: hidden; }
  .tube span { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--c) 0 10px, color-mix(in srgb, var(--c) 75%, #fff) 10px 20px); border-right: 3px solid var(--ink); }
  .last { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .last p { margin: 0; font-weight: 800; width: 100%; }
  .mini { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background-size: cover; background-position: top; box-shadow: 2px 2px 0 var(--ink); }

  /* Plateau de cartes */
  .tray { margin-top: 36px; display: grid; grid-template-columns: repeat(5, minmax(0, 190px)); justify-content: center; gap: 22px; min-height: 290px; perspective: 1000px; }
  .empty { grid-column: 1 / -1; align-self: center; text-align: center; font-weight: 800; font-size: 18px; }
  .slot { cursor: pointer; animation: drop .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i) * 90ms); }
  @keyframes drop { from { transform: translateY(-120px) scale(.6) rotate(-12deg); opacity: 0; } }
  .flipper { position: relative; aspect-ratio: 5/7; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
  .slot.revealed .flipper { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; }
  .back { border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); background: radial-gradient(circle, #fff6 6px, transparent 7px) 0 0 / 26px 26px, linear-gradient(135deg, var(--gum), var(--grape)); display: grid; place-items: center; }
  .back::after { content: "?"; font-family: "Dela Gothic One"; font-size: 64px; color: var(--white); text-shadow: 4px 4px 0 var(--ink); }
  .slot:not(.revealed):hover .back { transform: translateY(-6px) rotate(-2deg); transition: transform .2s; }
  .front { transform: rotateY(180deg); }

  .card { --c: var(--N); position: relative; height: 100%; border-radius: 20px; border: 4px solid var(--ink); background: var(--white); box-shadow: 6px 6px 0 var(--ink); overflow: hidden;
    transform: rotateX(var(--rx, 0)) rotateY(var(--ry, 0)); transition: transform .15s, box-shadow .2s; }
  .card:hover { box-shadow: 10px 12px 0 var(--ink); }
  .card[data-r="R"] { --c: var(--R); } .card[data-r="SR"] { --c: var(--SR); } .card[data-r="SSR"] { --c: var(--SSR); } .card[data-r="UR"] { --c: var(--UR); }
  .art { position: absolute; inset: 0 0 34% 0; background: var(--c); }
  .art img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .glare { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), #ffffff70, transparent 45%); opacity: 0; transition: opacity .2s; }
  .card:hover .glare { opacity: 1; }
  .tag { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: 999px; background: var(--c); color: var(--white); border: 3px solid var(--ink); font-family: "Dela Gothic One"; font-size: 14px; text-shadow: 1px 1px 0 var(--ink); }
  .serial { position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 999px; background: var(--white); border: 3px solid var(--ink); font-weight: 800; font-size: 12px; }
  .plate { position: absolute; inset: auto 0 0 0; height: 34%; padding: 8px 12px 10px; border-top: 4px solid var(--ink); background: var(--white); display: flex; flex-direction: column; gap: 2px; }
  .plate strong { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plate em { font-style: normal; font-size: 12px; font-weight: 700; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plate .row { margin-top: auto; }
  .row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 13px; }
  .type { padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, white); border: 2px solid var(--ink); font-size: 12px; }
  .card[data-r="UR"] { border-color: transparent; background: linear-gradient(var(--white), var(--white)) padding-box, conic-gradient(from var(--a, 0deg), #ff4f8b, #ffdf3d, #35d6a0, #3fb6ff, #a26bff, #ff4f8b) border-box; animation: spin 3s linear infinite; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --a: 360deg; } }
  .card[data-f="HOLO"] .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 25%, #ff6fb566 38%, #ffe45c66 48%, #6fd6ff66 58%, transparent 72%); background-size: 220% 220%; background-position: var(--mx, 0%) var(--my, 0%); mix-blend-mode: color-dodge; }

  .burst { position: absolute; inset: -40px; pointer-events: none; background: conic-gradient(from 0deg, transparent 0 8deg, #ffdf3d 8deg 14deg, transparent 14deg 30deg) ; mask: radial-gradient(circle, transparent 30%, #000 31%, transparent 70%); animation: burst 1s ease-out forwards; z-index: -1; }
  @keyframes burst { from { transform: scale(.3) rotate(0); opacity: 1; } to { transform: scale(1.4) rotate(40deg); opacity: 0; } }
  .slot { position: relative; }
  .actions { text-align: center; margin-top: 20px; }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } .tray { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo display"><i></i>Anime Masters</div>
  <nav><a href="#" aria-current="page">Paquets</a><a href="#">Album</a><a href="#">Classement</a></nav>
  <div class="right"><button class="chip" id="snd" aria-pressed="true">🔊 Son activé</button><span class="chip">🍡 Mika</span></div>
</header>
<main>
  <section class="stage">
    <div class="panel machine">
      <div class="globe" aria-hidden="true">
        <span class="cap" style="--c:#ff5fa8;left:20px;top:120px"></span><span class="cap" style="--c:#3fb6ff;left:80px;top:150px"></span>
        <span class="cap" style="--c:#ffdf3d;left:140px;top:125px"></span><span class="cap" style="--c:#35d6a0;left:50px;top:70px"></span>
        <span class="cap" style="--c:#a26bff;left:115px;top:72px"></span><span class="cap" style="--c:#ff9f1c;left:160px;top:30px"></span>
      </div>
      <div class="base">
        <div class="count display">9<small>capsules à ouvrir</small></div>
        <button class="knob" id="knob" aria-label="Tourner la manette pour ouvrir une capsule"></button>
      </div>
      <p class="hint">Tourne la manette !</p>
    </div>
    <div class="panel info">
      <div>
        <h1 class="display">Ta prochaine capsule arrive</h1>
        <p class="timer">Nouvelle capsule dans <b>4:12</b> · stock max 10</p>
      </div>
      <div class="pity">
        <div class="gauge"><p>SSR garanti dans 6 paquets</p><div class="tube"><span style="--c:var(--SSR);width:60%"></span></div></div>
        <div class="gauge"><p>UR garanti dans 71 paquets</p><div class="tube"><span style="--c:var(--UR);width:29%"></span></div></div>
      </div>
      <div class="last">
        <p>Tes derniers coups de chance</p>
        <span class="mini" style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b40-MNypXsxSRb1R.png)"></span>
        <span class="mini" style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b71-1W4panC53vfs.png)"></span>
        <span class="mini" style="background-image:url(https://s4.anilist.co/file/anilistcdn/character/large/b89361-tq8PQQ4MmF0M.png)"></span>
      </div>
    </div>
  </section>
  <section class="tray" id="tray"><p class="empty">Tourne la manette : 5 cartes vont tomber ici.</p></section>
  <div class="actions" id="actions" hidden><button class="chip" id="all">Tout révéler</button></div>
</main>
<script src="shared.js"></script>
<script>
  Sound.profile = "pop";
  soundToggle(document.getElementById("snd"));
  const card = (c) => `<article class="card" data-tilt data-r="${c.rarity}" data-f="${c.finish || "NORMAL"}">
    <div class="art"><img src="${c.img}" alt="${c.name}"></div><div class="glare"></div>
    <span class="tag">${c.rarity}</span><span class="serial">#${c.serial}</span>
    <div class="plate"><strong>${c.name}</strong><em>${c.series}</em>
    <div class="row"><span class="type" title="${TYPES[c.type][1]}">${TYPES[c.type][0]}</span><span>⚔️ ${c.atk}</span><span>🛡️ ${c.def}</span></div></div></article>`;
  const knob = document.getElementById("knob"), tray = document.getElementById("tray");
  knob.addEventListener("click", () => {
    knob.classList.remove("turn"); void knob.offsetWidth; knob.classList.add("turn");
    setTimeout(() => {
      openPack(tray, card, { onUR: (slot) => { const b = document.createElement("div"); b.className = "burst"; slot.appendChild(b); } });
      document.getElementById("actions").hidden = false;
    }, 450);
  });
  document.getElementById("all").addEventListener("click", () => revealAll(tray));
</script>
</body>
</html>
