<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyber futuriste · Anime Masters</title>
<style>
  /* Base commune : chaque thème redéfinit ces variables et ajoute son propre CSS */
  :root {
    --bg: #05060c; --ink: #fff; --muted: #ffffffb0; --accent: #3cf2ff; --accent2: #ff4fd8; --hl: #f5ff4a;
    --panel: #0b1430b8; --panel-line: #ffffff26; --radius: 16px;
    --font-display: system-ui; --font-body: system-ui; --display-weight: 700;
    --logo: var(--accent); --logo-glow: 0 0 14px var(--accent);
    --btn: #ffffff14; --btn-line: #ffffff33; --btn-primary: linear-gradient(135deg, var(--accent), var(--accent2)); --btn-primary-ink: #fff;
    --hint: var(--ink); --hint-glow: none; --header-fade: #00000088;
    --SSR: #ffb020; --UR: #ff4fd8;
    --flash: radial-gradient(circle at 50% 45%, #fff7c2 0%, #ffb020aa 30%, transparent 65%);
    --vig: radial-gradient(ellipse at 50% 45%, transparent 50%, #000000a0 100%);
    --ur-bg: radial-gradient(circle, #2a0d63, #040a1c 70%);
    --ur-rays: repeating-conic-gradient(#ff4fd855 0 5deg, transparent 5deg 12deg, #3cf2ff55 12deg 17deg, transparent 17deg 24deg);
    --ur-frame: conic-gradient(from var(--a), #ff4fd8, #3cf2ff, #f5ff4a, #8a3cff, #ff4fd8);
    --ur-label: linear-gradient(90deg, #ff4fd8, #f5ff4a, #3cf2ff, #8a3cff, #ff4fd8);
    --ur-glow: #ff4fd8aa; --ur-ink: #fff; --ur-star: "✦";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 28px; padding: 16px 28px; background: linear-gradient(var(--header-fade), transparent); }
  .logo { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 22px; color: var(--logo); text-shadow: var(--logo-glow); white-space: nowrap; }
  nav { display: flex; gap: 6px; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 10px; }
  nav a[aria-current] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  nav a:hover { color: var(--accent); }
  nav a .badge { margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; }
  nav a.bump { animation: bump .55s ease-out; }
  @keyframes bump { 30% { scale: 1.25; color: var(--accent); text-shadow: 0 0 18px var(--accent); } }
  .right { margin-left: auto; display: flex; gap: 10px; }
  .btn { font: 600 14px var(--font-body); color: var(--ink); background: var(--btn); border: 1.5px solid var(--btn-line); border-radius: 12px; padding: 9px 16px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .btn:hover { border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 50%, transparent); }
  .btn:focus-visible, .booster:focus-visible { outline: 3px solid var(--hl); outline-offset: 4px; }
  .btn.primary { background: var(--btn-primary); color: var(--btn-primary-ink); border-color: transparent; font-size: 16px; padding: 12px 22px; }

  .hud { position: absolute; top: 76px; right: 28px; width: 270px; background: var(--panel); border: 1.5px solid var(--panel-line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
  .hud .big { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 36px; line-height: 1; }
  .hud .big small { font: 600 14px var(--font-body); color: var(--muted); }
  .stock { display: flex; gap: 4px; margin-top: 8px; }
  .stock i { flex: 1; height: 20px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 10%, transparent); transition: background .3s; }
  .stock i.on { background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
  .hud p { margin: 0; color: var(--muted); font-size: 14px; }
  .hud p b { color: var(--hl); }
  .leds p { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 600; color: var(--ink); }
  .bar { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; }
  .bar i { height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .bar i.on { background: var(--c); box-shadow: 0 0 6px var(--c); }

  /* Booster : la forme est fournie par le thème, l'animation d'ouverture est commune */
  .booster { position: absolute; left: 50%; top: 46%; translate: -50% -50%; width: 200px; aspect-ratio: 3/4.4; border: 0; padding: 0; cursor: pointer; background: none; color: inherit; font: inherit;
    animation: float 3.4s ease-in-out infinite; transition: scale .2s; }
  .booster:hover { scale: 1.05; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes hue { to { --a: 360deg; } }
  @keyframes float { 50% { translate: -50% calc(-50% - 12px); } }
  .booster.tear { animation: tear .55s cubic-bezier(.5,0,.8,.3) forwards; }
  @keyframes tear { 30% { scale: 1.1; rotate: -3deg; filter: brightness(1.6); } to { scale: .3; rotate: 20deg; opacity: 0; translate: -50% -20%; } }
  .booster[hidden] { display: none; }

  .bottom { position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; align-items: center; gap: 18px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .hint { font-weight: 700; font-size: 17px; color: var(--hint); text-shadow: var(--hint-glow); pointer-events: none !important; }

  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: var(--flash); }
  .flash.go { animation: flash .9s ease-out; }
  @keyframes flash { 10% { opacity: 1; } to { opacity: 0; } }
  .vig { position: absolute; inset: 0; pointer-events: none; background: var(--vig); }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s; background: radial-gradient(circle at 50% 45%, transparent 20%, #000 75%); }
  .vignette.on { opacity: .85; }

  /* Cinématique UR plein écran */
  .ur { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; cursor: pointer; background: var(--ur-bg); color: var(--ur-ink); }
  .ur[hidden] { display: none; }
  .ur .rays { position: absolute; width: 260vmax; height: 260vmax; left: 50%; top: 50%; translate: -50% -50%; background: var(--ur-rays); mask: radial-gradient(circle, #000 0, transparent 45%); animation: spin 16s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  .ur .whiteout { position: absolute; inset: 0; background: #fff; animation: whiteout .7s ease-out forwards; pointer-events: none; }
  @keyframes whiteout { to { opacity: 0; } }
  .ur .stage { position: relative; display: grid; grid-template-columns: auto auto; align-items: center; gap: 4vw; }
  .ur .art { width: min(34vw, 380px); aspect-ratio: 2/3; border-radius: 22px; padding: 5px; background: var(--ur-frame);
    animation: hue 2.4s linear infinite, art-in .9s cubic-bezier(.2,1.4,.4,1) both .15s; box-shadow: 0 0 80px var(--ur-glow); }
  .ur .art img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 18px; display: block; }
  @keyframes art-in { from { transform: translateX(30vw) rotate(12deg) scale(.6); opacity: 0; } }
  .ur .label { font-family: var(--font-display); font-weight: var(--display-weight); font-size: clamp(44px, 8vw, 112px); line-height: .95; margin: 0;
    background: var(--ur-label); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px var(--ur-glow)); animation: slam .7s cubic-bezier(.2,1.6,.4,1) both .35s, shift 2.4s linear infinite; }
  @keyframes slam { from { transform: scale(3) translateX(-10vw); opacity: 0; letter-spacing: .4em; } }
  @keyframes shift { to { background-position: 200% 0; } }
  .ur h2 { margin: 18px 0 4px; font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px); font-weight: var(--display-weight); animation: up .5s ease-out both .8s; }
  .ur .series { margin: 0; font-size: 20px; opacity: .75; animation: up .5s ease-out both .95s; }
  .ur .serial { display: inline-block; margin-top: 16px; padding: 4px 12px; border-radius: 8px; background: color-mix(in srgb, var(--ur-ink) 14%, transparent); font-weight: 700; animation: up .5s ease-out both 1.1s; }
  @keyframes up { from { transform: translateY(20px); opacity: 0; } }
  .ur .skip { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; opacity: .7; font-weight: 600; animation: up .5s ease-out both 1.6s; }
  .ur .star { position: absolute; color: var(--ur-ink); text-shadow: 0 0 10px currentColor; animation: twinkle 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes twinkle { 50% { opacity: .2; scale: .6; } }
  .ur.out { animation: out .45s ease-in forwards; }
  @keyframes out { to { opacity: 0; scale: 1.08; } }



  /* Intégré dans /packs : la page hôte fournit la navigation, il ne reste que le bouton de son */
  .embed .logo, .embed header nav, .embed .right > span { display: none; }
  .embed header { top: auto; bottom: 20px; right: auto; left: 20px; padding: 0; background: none; pointer-events: none; } .embed header .btn { pointer-events: auto; }
  .embed .hud { top: 76px; }

  @media (max-width: 760px) { .hud { display: none; } .ur .stage { grid-template-columns: 1fr; text-align: center; } .ur .art { width: 60vw; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
<style id="theme-css"></style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="Scène d'ouverture de paquet"></canvas>
<div class="ui">
  <header>
    <div class="logo">Anime Masters</div>
    <nav><a href="#" aria-current="page">Paquets</a><a href="#" id="albumLink">Album<span class="badge" id="albumBadge" hidden></span></a><a href="#">Classement</a></nav>
    <div class="right"><button class="btn" id="snd" aria-pressed="true">Son activé</button><span class="btn">Mika</span></div>
  </header>
  <aside class="hud">
    <div><div class="big"><span id="count">9</span><small id="maxPacks"> / 10 boosters</small></div><div class="stock" id="stock"></div></div>
    <p id="nextIn"></p>
    <div class="leds"><p>Puissance totale <span id="totalPower">⚡ 0</span></p></div>
    <div class="leds"><p>SSR garanti <span>dans <b id="ssrLeft">6</b></span></p><div class="bar" style="--c:var(--SSR)" id="ssr"></div></div>
    <div class="leds"><p>UR garanti <span>dans <b id="urLeft">71</b></span></p><div class="bar" style="--c:var(--UR)" id="ur"></div></div>
  </aside>
  <button class="booster" id="booster" aria-label="Ouvrir le booster"></button>
  <div class="bottom"><span class="hint" id="hint" aria-live="polite">Clique sur le booster pour l'ouvrir</span><button class="btn" id="all" hidden>Tout révéler</button><button class="btn primary" id="next" hidden>Ouvrir le suivant</button></div>
  <div class="vig"></div>
  <div class="vignette" id="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="ur" id="urScreen" hidden role="dialog" aria-label="Ultra rare obtenu">
    <div class="rays"></div>
    <div class="stage">
      <div class="art"><img id="urImg" alt="" /></div>
      <div><p class="label" id="urLabel">Ultra<br />rare</p><h2 id="urName"></h2><p class="series" id="urSeries"></p><span class="serial" id="urSerial"></span></div>
    </div>
    <div class="whiteout"></div>
    <p class="skip">Clique ou Échap pour continuer</p>
  </div>
</div>
<script type="module">
import { start, MODES } from "./futur/engine.js";
const id = MODES[0].id;
if (new URLSearchParams(location.search).has("embed") && parent !== window) document.body.classList.add("embed");
// En cas d'échec (WebGL absent…), la page hôte bascule sur l'ouverture classique
start(id).catch((e) => { console.error(e); document.title = "ERREUR : " + (e?.stack ?? e).toString().slice(0, 300); if (parent !== window) parent.postMessage({ type: "unsupported" }, location.origin); });
</script>
</body>
</html>
