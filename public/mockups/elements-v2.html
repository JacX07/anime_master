<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feu et eau compacts — maquette</title><style>
:root{--ink:#e8e6f0;--quiet:#9a96ad;--line:#2e2a3d;--plate:#1b1826;font-family:'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;padding:12px;color:var(--ink);background:#0e0c16}main{max-width:900px;margin:0 auto;display:grid;gap:12px}
h1{font-size:16px;margin:0}p{margin:0;font-size:12px;color:var(--quiet);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{border:1px solid var(--line);border-radius:10px;background:var(--plate);overflow:hidden}
.cell canvas{display:block;width:100%;height:auto;background:radial-gradient(120% 90% at 50% 0%,#2a2547,#120f1d 70%)}
.cell div{padding:8px 10px}.cell h3{margin:0 0 3px;font-size:13px}
button{font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--plate);color:var(--ink);cursor:pointer}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Feu et eau : version courte</h1>
<p>Chaque effet reste dans l'empreinte de la carte ciblée (pas de fumée ni de nappe qui déborde) et dure moins d'une demi-seconde après l'impact. Cliquer sur une case la rejoue. Les chiffres rouges montrent les dégâts du splash.</p>
<button id="all">↻ Tout rejouer</button>
<div class="grid" id="grid"></div>
</main><script>
const R=(a,b)=>a+Math.random()*(b-a),seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),eo=v=>1-(1-v)**3;
const FEU=["#fff6cf","#ffb63d","#ec4a1f","#6e170c"],EAU=["#effcff","#77d8ff","#2b82dc","#123a7a"];
const W=450,H=240,GY=190,A={x:90,y:120},B={x:340,y:120},CW=80,CH=110;
// Variantes : [id, titre, description, durée totale (s)]
const V=[
 ["feu-a","Feu A — Flammèches","Boule de feu courte (0,2 s). À l'impact, une dizaine de petites langues de feu lèchent le bas de la carte (0,5 s), quelques braises. Pas de fumée. Une petite flamme reste au-dessus de la carte tant que la brûlure dure.",1.1],
 ["feu-b","Feu B — Éclat","Éclat orange en anneau à l'impact (0,25 s) puis trois langues de feu qui montent de 30 px, rien d'autre. Même petite flamme d'état au-dessus de la carte. Le plus discret.",1],
 ["eau-a","Eau A — Couronne","Goutte rapide (0,18 s). À l'impact, couronne de gouttes qui jaillit à ±50 px et retombe, anneau plat au sol (0,45 s). Les dégâts s'affichent avec le splash. Pas de nappe, pas de brume.",1.1],
 ["eau-b","Eau B — Gifle","Une nappe d'eau traverse la carte de gauche à droite (0,3 s) en laissant des gouttes ; les dégâts tombent au passage. Un peu plus de mouvement, aussi compact.",1.1],
];
const cells={};
for(const [id,title,desc,dur] of V){
 const d=document.createElement("div");d.className="cell";d.innerHTML=`<canvas width="${W}" height="${H}"></canvas><div><h3>${title}</h3><p>${desc}</p></div>`;
 document.getElementById("grid").append(d);
 const cv=d.firstChild,x=cv.getContext("2d");cells[id]={x,t0:performance.now(),dur,P:[],fired:false,dmg:0};
 d.onclick=()=>reset(id);
}
function reset(id){const c=cells[id];c.t0=performance.now()+150;c.P=[];c.fired=false;c.dmg=0}
document.getElementById("all").onclick=()=>V.forEach(v=>reset(v[0]));
function card(x,cx,cy,col,hit){
 x.save();x.translate(cx+(hit?R(-1.5,1.5):0),cy);x.fillStyle="#2b2745";x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.roundRect(-CW/2,-CH/2,CW,CH,8);x.fill();x.stroke();
 x.fillStyle="#3c3760";x.fillRect(-CW/2+8,-CH/2+8,CW-16,CH*.5);x.fillStyle="#1c1930";x.fillRect(-CW/2+8,CH/2-30,CW-16,8);x.fillRect(-CW/2+8,CH/2-18,CW-30,6);x.restore();
}
function glow(x,px,py,r,col,a=1){const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1}
function flame(x,px,py,s,life,c){ // petite langue de feu en goutte inversée
 const a=1-life;x.save();x.translate(px,py);x.scale(1,1+life*.4);
 for(const [k,col] of [[1,c[2]],[.66,c[1]],[.36,c[0]]]){x.globalAlpha=a*.95;x.fillStyle=col;x.beginPath();x.moveTo(0,-s*1.5*k*(1-life*.3));x.quadraticCurveTo(s*.9*k,-s*.2,0,s*.5*k);x.quadraticCurveTo(-s*.9*k,-s*.2,0,-s*1.5*k*(1-life*.3));x.fill()}
 x.restore();x.globalAlpha=1}
function dmgText(x,t,T,px,py){const k=seg(t,T,T+.7);if(k<=0||k>=1)return;x.save();x.globalAlpha=1-seg(k,.6,1);x.font="bold 20px sans-serif";x.textAlign="center";x.lineWidth=4;x.strokeStyle="#151a36";const s="-1 240",yy=py-CH/2-14-eo(seg(k,0,.4))*18;x.strokeText(s,px,yy);x.fillStyle="#ff5a4d";x.fillText(s,px,yy);x.restore()}
function frame(id,now){
 const c=cells[id],x=c.x,t=(now-c.t0)/1000;x.clearRect(0,0,W,H);
 x.fillStyle="#1a1626";x.fillRect(0,GY,W,H-GY);x.strokeStyle="rgba(255,255,255,.12)";x.beginPath();x.moveTo(0,GY);x.lineTo(W,GY);x.stroke();
 if(t>c.dur+.6)reset(id);
 const T=.22,el=id.startsWith("feu")?FEU:EAU,hit=t>T&&t<T+.25;
 card(x,A.x,A.y,"#6f65b8",false);card(x,B.x,B.y,"#6f65b8",hit);
 if(t<0)return;
 // projectile
 const k=seg(t,0,T);
 if(k>0&&k<1){const px=A.x+CW/2+(B.x-CW/2-A.x-CW/2)*k,py=A.y-12*Math.sin(Math.PI*k);
  x.globalCompositeOperation="lighter";
  if(el===FEU){glow(x,px,py,34,el[2],.7);glow(x,px,py,20,el[1]);glow(x,px,py,9,"#fff")}
  else{x.globalCompositeOperation="source-over";x.fillStyle=el[2];x.beginPath();x.ellipse(px,py,11,9,0,0,7);x.fill();x.fillStyle=el[1];x.beginPath();x.ellipse(px-1,py-1,8,6,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(px-3,py-3,3,1.6,-.6,0,7);x.fill()}
  x.globalCompositeOperation="source-over"}
 // impact : on génère les particules une fois
 if(t>=T&&!c.fired){c.fired=true;const bx=B.x,by=B.y;
  if(id==="feu-a"){for(let i=0;i<11;i++)c.P.push({k:"fl",x:bx+R(-CW*.4,CW*.4),y:by+CH/2-R(0,CH*.35),vy:R(-70,-30),s:R(7,12),l:-R(0,.15),m:R(.3,.5)});
    for(let i=0;i<10;i++){const a=R(0,6.28),v=R(40,130);c.P.push({k:"em",x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,s:R(1.5,2.8),l:0,m:R(.3,.55)})}}
  if(id==="feu-b"){c.P.push({k:"ring",x:bx,y:by,l:0,m:.25,col:FEU[1]});for(let i=0;i<3;i++)c.P.push({k:"fl",x:bx+(i-1)*CW*.28,y:by+CH/2-6,vy:-90,s:R(10,14),l:-i*.05,m:.45})}
  if(id==="eau-a"){for(let i=0;i<22;i++){const a=R(-2.6,-.55),v=R(110,230);c.P.push({k:"dr",x:bx,y:by+CH/2-18,vx:Math.cos(a)*v*.6,vy:Math.sin(a)*v,s:R(2,4),l:0,m:R(.35,.5),col:i%3?EAU[1]:EAU[0]})}
    c.P.push({k:"flat",x:bx,y:GY-4,l:0,m:.45})}
  if(id==="eau-b"){c.P.push({k:"sheet",x:bx,y:by,l:0,m:.32});for(let i=0;i<16;i++)c.P.push({k:"dr",x:bx-CW/2+R(0,20),y:by+R(-CH*.35,CH*.35),vx:R(60,200),vy:R(-110,-20),s:R(2,3.5),l:-R(0,.18),m:R(.3,.45),col:i%3?EAU[1]:EAU[0]})}
 }
 const dt=1/60;
 c.P=c.P.filter(p=>{p.l+=dt;if(p.l<0)return true;const u=p.l/p.m;if(u>=1)return false;
  if(p.k==="fl"){p.y+=p.vy*dt;x.globalCompositeOperation="lighter";flame(x,p.x,p.y,p.s,u,FEU);glow(x,p.x,p.y,p.s*2,FEU[2],.25*(1-u));x.globalCompositeOperation="source-over"}
  else if(p.k==="em"){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=60*dt;x.globalCompositeOperation="lighter";x.globalAlpha=1-u;x.fillStyle=FEU[1];x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();x.globalAlpha=1;x.globalCompositeOperation="source-over"}
  else if(p.k==="ring"){x.globalCompositeOperation="lighter";x.globalAlpha=(1-u)*.9;x.strokeStyle=p.col;x.lineWidth=5*(1-u)+1;x.beginPath();x.arc(p.x,p.y,10+eo(u)*50,0,7);x.stroke();glow(x,p.x,p.y,50*(1-u),FEU[0],.7*(1-u));x.globalAlpha=1;x.globalCompositeOperation="source-over"}
  else if(p.k==="dr"){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;if(p.y>GY){p.y=GY;p.vy*=-.2;p.vx*=.5}x.globalAlpha=1-u*u;x.fillStyle=p.col;x.strokeStyle="#151a36";x.lineWidth=1;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();x.stroke();x.globalAlpha=1}
  else if(p.k==="flat"){x.globalAlpha=(1-u)*.9;x.strokeStyle=EAU[0];x.lineWidth=2.5*(1-u)+.5;x.beginPath();x.ellipse(p.x,p.y,10+eo(u)*52,3+eo(u)*7,0,0,7);x.stroke();x.globalAlpha=1}
  else if(p.k==="sheet"){const k2=eo(u),x0=p.x-CW/2-8,x1=x0+(CW+16)*k2;x.globalAlpha=(1-u*u)*.85;
   const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,"rgba(43,130,220,0)");g.addColorStop(.7,EAU[2]);g.addColorStop(1,EAU[0]);x.fillStyle=g;x.beginPath();x.roundRect(x0,p.y-CH/2,Math.max(1,x1-x0),CH,10);x.fill();
   x.strokeStyle=EAU[0];x.lineWidth=2;x.beginPath();x.moveTo(x1,p.y-CH/2+4);x.quadraticCurveTo(x1+8,p.y,x1,p.y+CH/2-4);x.stroke();x.globalAlpha=1}
  return true});
 // état brûlure : flamme au-dessus de la carte (feu seulement), 2 actions
 if(el===FEU&&t>T+.1&&t<c.dur-.1){x.globalCompositeOperation="lighter";const fy=B.y-CH/2-10+Math.sin(t*12)*1.5;flame(x,B.x,fy,6,(t*3)%1*.3,FEU);glow(x,B.x,fy,16,FEU[2],.35);x.globalCompositeOperation="source-over"}
 if(el===EAU&&t>T+.1&&t<c.dur-.1){x.fillStyle=EAU[1];x.strokeStyle="#151a36";x.lineWidth=1.5;x.beginPath();x.moveTo(B.x,B.y-CH/2-20);x.quadraticCurveTo(B.x+6,B.y-CH/2-11,B.x,B.y-CH/2-6);x.quadraticCurveTo(B.x-6,B.y-CH/2-11,B.x,B.y-CH/2-20);x.fill();x.stroke()}
 if(el===EAU)dmgText(x,t,T,B.x,B.y);
}
V.forEach(v=>reset(v[0]));
(function loop(now){V.forEach(v=>frame(v[0],now));requestAnimationFrame(loop)})(performance.now());
</script></body></html>
