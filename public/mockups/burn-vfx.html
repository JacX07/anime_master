<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:var(--foreground,#eee);font:14px system-ui}.bt{--spd:1;position:relative;width:240px;margin:30px auto;}.card{width:180px;margin:auto;position:relative}.portrait{width:180px;display:block;border-radius:10px}.bt-sfx{position:absolute;left:-30px;top:-28px;width:240px;height:308px;pointer-events:none;overflow:visible}.bt[data-paused] *{animation-play-state:paused!important}button,select{padding:8px 12px;background:var(--secondary,#222);color:inherit;border:1px solid var(--border,#555);border-radius:5px;font:inherit}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}p{text-align:center;font-size:12px;color:var(--muted-foreground,#aaa)}/* Brûlure : trois rubans texturés, aucun filtre animé ni voile sur le portrait. */
.bt-sfx .burn-ribbon {
  transform-box: fill-box; transform-origin: 50% 85%;
  animation: burn-ribbon calc(.84s / var(--spd, 1)) ease-in-out infinite alternate;
  animation-delay: calc(var(--burn-phase, 0s) / var(--spd, 1));
}
@keyframes burn-ribbon {
  0% { transform: translateY(1px) skewX(-5deg) scale(.94, .91); opacity: .82; }
  48% { transform: translateY(-1px) skewX(2deg) scale(1.04, 1.02); opacity: 1; }
  100% { transform: translateY(-2px) skewX(6deg) scale(.97, 1.1); opacity: .93; }
}
.bt-sfx .burn-spark {
  animation: burn-spark calc(1.7s / var(--spd, 1)) linear infinite;
  animation-delay: calc(var(--burn-phase, 0s) / var(--spd, 1));
}
@keyframes burn-spark {
  0% { transform: translate(0, 0); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(3px, -31px); opacity: 0; }
}
.bt-sfx .burn-application { animation: burn-application .7s ease-out both; }
.bt-sfx-ap .burn-spark {
  animation-duration: 1.7s;
  animation-delay: var(--burn-phase, 0s);
}
@keyframes burn-application { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
