<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statuts — recherches anime / manga</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#e9e9ed);font:14px var(--font-sans,system-ui)}button{font:inherit;color:inherit;background:var(--secondary,#24242c);border:1px solid var(--border,#444);padding:7px 12px;border-radius:6px;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}header span{color:var(--muted-foreground,#999);font-size:12px}section{border:1px solid var(--border,#36363e);border-radius:var(--radius,10px);padding:16px;margin-bottom:14px;background:var(--card,#19191f)}h2{font-size:16px;margin:0 0 5px}p{font-size:12px;color:var(--muted-foreground,#aaa);margin:0 0 12px;line-height:1.5}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.example{text-align:center;min-width:0}.example svg{width:100%;max-width:190px;display:block;margin:auto;overflow:visible}small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground,#b3b3bd)}.flame{transform-box:fill-box;transform-origin:bottom;animation:fire 380ms steps(3,end) infinite alternate}.smoke{animation:smoke 2.4s ease-out infinite}.spark{animation:ember 1.4s linear infinite}.seal{animation:pulse 1.8s steps(3,end) infinite}.strike{animation:strike 3s steps(1,end) infinite}.halt *{animation-play-state:paused!important}@keyframes fire{from{transform:skewX(-7deg) scaleY(.88)}to{transform:skewX(5deg) scaleY(1.1)}}@keyframes smoke{0%{transform:translateY(8px);opacity:0}25%{opacity:.4}100%{transform:translate(-6px,-34px);opacity:0}}@keyframes ember{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(8px,-70px);opacity:0}}@keyframes pulse{50%{opacity:.48}}@keyframes strike{0%,8%{opacity:1}9%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.strike{display:none}}@media(max-width:440px){section{padding:12px}.examples{gap:2px}h2{font-size:14px}small{font-size:9px}}
</style><header><span>MAQUETTES · BOUCLES DE STATUTS</span><button id="pause" aria-pressed="false">Pause</button></header><main id="board"></main>
<script>
const palettes=[['#e74923','#ffb24a','#fff0c6'],['#ddd9cb','#fffaf0','#19191c'],['#972e25','#e66a35','#eac397']];
const defs=`<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0V5" stroke="#f2e8d0" stroke-width=".65" opacity=".3"/></pattern><pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#eee5cf" opacity=".28"/></pattern></defs>`;
function card(i){return `<rect x="32" y="22" width="116" height="162" rx="3" fill="#13161d" stroke="#55515a"/><path d="M33 23H147V183H33Z" fill="url(#${i===1?'dots':'hatch'})"/><path d="M49 178L55 120 76 108 106 109 128 125 137 178Z" fill="#252932"/><path d="M65 80L65 57 80 42 103 46 117 65 109 94 96 109 80 103Z" fill="#6d7078"/><path d="M62 79L58 58 72 34 88 40 101 32 115 48 123 72 110 66 100 54 95 71 87 60 79 82 72 69Z" fill="#181a22"/><path d="M75 81L85 79M98 79L107 80M89 95L98 94" stroke="#19191f" stroke-width="2"/><path d="M59 121L78 139 88 115 105 138 123 123M77 139L71 178M105 138L112 178" fill="none" stroke="#85848a" stroke-width="1"/><path d="M38 166H142" stroke="#837868"/><text x="42" y="178" fill="#d5c9b8" font-size="7" font-family="monospace" letter-spacing="2">PERSONNAGE</text>`}
function burn(i){const [red,gold,white]=palettes[i];let out='';for(let n=0;n<7;n++){let x=28+n*20,h=40+(n*17%46);out+=`<g transform="translate(${x} 185)"><g class="flame" style="animation-delay:-${n*.13}s"><path d="M-12 0L-9-15-16-31-4-24 1-${h} 9-${h-13} 5-25 16-38 10-12 15 0Z" fill="${red}"/><path d="M-5 0L-3-15 2-${h-14} 5-19 9-26 4 0Z" fill="${gold}"/><path d="M0 0L1-20 4-9 5 0Z" fill="${white}"/></g></g>`}for(let n=0;n<14;n++)out+=`<path class="spark" style="animation-delay:-${n*.17}s" d="M${25+n*11} ${161-n%3*22}l2-6 1 4-2 5Z" fill="${n%3?gold:white}"/>`;if(i===2)for(let n=0;n<4;n++)out+=`<path class="smoke" style="animation-delay:-${n*.6}s" d="M${30+n*35} 150q-20-28-5-48t-3-44q29 20 17 45t8 48Z" fill="#746866"/>`;return out}
function poison(i){let c=i===1?'#d8d5ce':i===2?'#8b759d':'#af85ca';let s='';for(let n=0;n<5;n++)s+=`<path class="smoke" style="animation-delay:-${n*.46}s" d="M${25+n*31} 182q-13-23-5-41t-2-37q25 14 17 36t9 42Z" fill="${c}" opacity=".4"/>`;s+=`<g class="seal" fill="none" stroke="${c}" stroke-width="1.2"><path d="M43 54L55 46 63 57 54 69 66 84M127 97L116 111 123 126 111 137M51 139L61 126 52 115"/><path d="M41 53L49 72 44 87M128 98L135 114 129 132" stroke-width=".5"/></g>`;return s}
function silence(i){let c=i===1?'#e1d9c7':i===2?'#a59c91':'#c5a980';return `<g class="seal"><path d="M31 52L151 138M30 139L150 53" stroke="#13141a" stroke-width="12"/><path d="M31 52L151 138M30 139L150 53" stroke="${c}" stroke-width="8"/><g stroke="#37323a" stroke-width="1.4">${Array.from({length:11},(_,n)=>`<path d="M${37+n*10} ${54+n*7.2}l2 7m-4-3 8 1M${37+n*10} ${135-n*7.2}l5-1m-3-3 1 6"/>`).join('')}</g><path d="M71 85L88 74 107 85 107 105 89 117 71 105Z" fill="#2b2027" stroke="${c}"/><path d="M80 87L97 104M97 87L80 104M79 82H100M79 109H100" stroke="${c}" stroke-width="1.4"/></g>`}
const names=['A · Anime cel — combustion nerveuse','B · Manga — encre et trames','C · Anime sombre — braises et fumée'];
const desc=['Flammes effilées, aplats rouge / ambre, animation saccadée. Poison en volutes et sceau de silence croisé.','Noir, blanc cassé, hachures. Le statut se lit par sa matière et sa silhouette, même sans couleur.','Feu bas, fumée grise, éclats de chaleur. Palette désaturée et effets concentrés sur les bords.'];
document.querySelector('#board').innerHTML=names.map((name,i)=>`<section><h2>${name}</h2><p>${desc[i]}</p><div class="examples">${['Brûlure','Poison','Silence'].map((label,j)=>`<div class="example"><svg role="img" aria-label="${label}, direction ${i+1}" viewBox="0 0 180 205">${defs}${card(i)}${[burn,poison,silence][j](i)}</svg><small>${label}</small></div>`).join('')}</div></section>`).join('');
document.querySelector('#pause').onclick=e=>{const paused=document.body.classList.toggle('halt');e.target.textContent=paused?'Reprendre':'Pause';e.target.setAttribute('aria-pressed',String(paused))};
</script></html>
