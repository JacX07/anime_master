<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éléments — maquette</title><style>
:root{--ink:var(--foreground,#e8e6f0);--quiet:var(--muted-foreground,#9a96ad);--line:var(--border,#2e2a3d);--plate:var(--card,#1b1826);font-family:var(--font-sans,'Segoe UI',sans-serif)}
*{box-sizing:border-box}body{margin:0;color:var(--ink)}main{max-width:900px;margin:0 auto;display:grid;gap:12px}
.stage{position:relative;border-radius:var(--radius,12px);overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2a2547,#120f1d 70%)}canvas{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bar span{font-size:12px;color:var(--quiet);margin-right:4px}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--plate);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--c,#7a6cf0);border-color:var(--c,#7a6cf0);color:#120f1d;font-weight:600}
.els{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.el{--c:#999;padding:10px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;background:var(--plate)}
.el h3{margin:0 0 4px;font-size:14px;color:var(--c)}.el p{margin:0 0 8px;font-size:11px;line-height:1.4;color:var(--quiet)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{font-size:11px;padding:3px 7px;border-radius:6px}.chips i{font-style:normal;opacity:.55;font-size:10px;margin-left:3px}
@media(max-width:700px){.els{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="stage"><canvas id="cv" width="900" height="330"></canvas></div>
<div class="bar"><span>Élément</span><span id="elBtns"></span><span style="margin-left:10px">Attaque</span><span id="stBtns"></span><button id="replay">↻ Rejouer</button></div>
<div class="els" id="els"></div>
</main><script>
const E={
  feu:{name:"Feu",c:["#fff6cf","#ffb63d","#ec4a1f","#6e170c"],d:"Boule de feu, braises qui montent, brûlure orange sur la cible."},
  eau:{name:"Eau",c:["#effcff","#77d8ff","#2b82dc","#123a7a"],d:"Orbe ondulant, gerbe d'éclaboussures, gouttes qui retombent. Inclut la glace."},
  foudre:{name:"Foudre",c:["#ffffff","#fff07a","#ffc21f","#4b2f8f"],d:"Éclair instantané en zigzag, flash blanc, étincelles qui grésillent."},
  air:{name:"Air",c:["#ffffff","#d6fff0","#86e2c0","#2a6e5e"],d:"Lames de vent en croissant, tourbillon autour de la cible."},
  terre:{name:"Terre",c:["#f3dcaa","#bb8b52","#7a5530","#33220f"],d:"Fissure au sol, pics de roche sous la cible, éboulis et poussière."},
};
// [nom, style actuel dans attack-visual.ts]
const ROSTER={
  feu:[["Roy Mustang","magic"],["Portgas D. Ace","magic"],["Kyoujurou Rengoku","slash"],["Itachi Uchiha","magic"],["Benimaru Shinmon","magic"],["Katsuki Bakugou","magic"],["Megumin","magic"],["Nezuko Kamado","magic"],["Sukuna","magic"],["Reze","magic"],["Shouto Todoroki","magic"]],
  eau:[["Giyuu Tomioka","slash"],["Tanjirou Kamado","slash"],["Aqua","magic"],["Roxy Migurdia","magic"],["Rukia Kuchiki","slash"],["Esdeath","magic"],["Emilia","magic"],["Rem","magic"]],
  foudre:[["Killua Zoldyck","melee"],["Sasuke Uchiha","magic"],["Kakashi Hatake","slash"],["Zenitsu Agatsuma","slash"],["Yoruichi Shihouin","slash"],["Nami","magic"]],
  air:[["Naruto Uzumaki","magic"],["Tatsumaki","magic"],["Tanya Degurechaff","magic"],["Kazuma Satou","melee"],["Howl","magic"]],
  terre:[["Edward Elric","magic"],["Gaara","magic"],["Alphonse Elric","melee"],["Reiner Braun","melee"],["Eijirou Kirishima","melee"],["Phosphophyllite","magic"]],
};
const STYLES={magic:"Sort",slash:"Tranchant",melee:"Mêlée"};
let elem="feu",style="magic",who="Roy Mustang",t0=performance.now(),P=[],D=[],fired={},shake=0,trail=[],light=null;
const cv=document.getElementById("cv"),x=cv.getContext("2d"),W=900,H=330,GY=268,INK="#151a36";
const A={x:200,y:170},B={x:700,y:170};
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),eo=v=>1-(1-v)**3,ei=v=>v*v*v,R=(a,b)=>a+Math.random()*(b-a);
// ---------- textures pré-rendues
function off(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return c}
const sprites={};
/** Nuage bruité (fumée, poussière, brume) teinté d'une couleur. */
function cloud(col){return sprites[col]||(sprites[col]=off(96,96,(g)=>{for(let i=0;i<34;i++){const r=R(8,26),px=48+R(-24,24),py=48+R(-24,24),gr=g.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,col);gr.addColorStop(1,"rgba(0,0,0,0)");g.globalAlpha=R(.12,.35);g.fillStyle=gr;g.beginPath();g.arc(px,py,r,0,7);g.fill()}}))}
const BG=off(W,H,(g)=>{const s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,"#2b2550");s.addColorStop(1,"#120f1e");g.fillStyle=s;g.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){g.globalAlpha=R(.1,.5);g.fillStyle="#cfc8ff";g.fillRect(R(0,W),R(0,GY*.6),1.5,1.5)}g.globalAlpha=1;
  // silhouettes lointaines (deux plans)
  [["#1d1934",.55,40],["#17142a",.75,60]].forEach(([col,base,amp])=>{g.fillStyle=col;g.beginPath();g.moveTo(0,GY);for(let px=0;px<=W;px+=30)g.lineTo(px,GY*base+Math.sin(px*.013+amp)*amp*.6+R(-8,8));g.lineTo(W,GY);g.fill()});
  const gr=g.createLinearGradient(0,GY,0,H);gr.addColorStop(0,"#2a2436");gr.addColorStop(1,"#121019");g.fillStyle=gr;g.fillRect(0,GY,W,H-GY);
  for(let i=0;i<500;i++){const py=R(GY,H),k=(py-GY)/(H-GY);g.globalAlpha=R(.05,.25);g.fillStyle=Math.random()<.5?"#000":"#8a80a8";g.fillRect(R(0,W),py,R(1,3)*(1+k),1)}
  for(let i=0;i<40;i++){const px=R(0,W),py=R(GY+6,H),r=R(2,5)*(1+(py-GY)/40);g.globalAlpha=.5;g.fillStyle="#3a3350";g.beginPath();g.ellipse(px,py,r,r*.5,0,0,7);g.fill();g.fillStyle="#544b70";g.beginPath();g.ellipse(px-r*.2,py-r*.15,r*.5,r*.22,0,0,7);g.fill()}
  g.globalAlpha=1;g.strokeStyle="rgba(255,255,255,.14)";g.beginPath();g.moveTo(0,GY);g.lineTo(W,GY);g.stroke();
  const v=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,W*.65);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.55)");g.fillStyle=v;g.fillRect(0,0,W,H)});
const motes=Array.from({length:30},()=>({x:R(0,W),y:R(20,GY),v:R(4,14),s:R(.6,1.8),ph:R(0,6)}));
// ---------- UI
function pressed(box,cur){[...box.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===cur))}
function ui(){
  const eb=document.getElementById("elBtns"),sb=document.getElementById("stBtns"),els=document.getElementById("els");
  for(const k in E){const b=document.createElement("button");b.dataset.v=k;b.textContent=E[k].name;b.style.setProperty("--c",E[k].c[1]);b.onclick=()=>{elem=k;who=ROSTER[k][0][0];style=ROSTER[k][0][1];sync();play()};eb.append(b)}
  for(const k in STYLES){const b=document.createElement("button");b.dataset.v=k;b.textContent=STYLES[k];b.onclick=()=>{style=k;sync();play()};sb.append(b)}
  for(const k in E){const d=document.createElement("div");d.className="el";d.style.setProperty("--c",E[k].c[1]);d.innerHTML=`<h3>${E[k].name}</h3><p>${E[k].d}</p><div class="chips"></div>`;
    for(const [n,s] of ROSTER[k]){const b=document.createElement("button");b.innerHTML=`${n}<i>${STYLES[s]}</i>`;b.dataset.v=n;b.style.setProperty("--c",E[k].c[1]);b.onclick=()=>{elem=k;style=s;who=n;sync();play()};d.lastChild.append(b)}els.append(d)}
  document.getElementById("replay").onclick=play;sync();
}
function sync(){pressed(elBtns,elem);pressed(stBtns,style);document.querySelectorAll(".chips button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===who))}
function play(){t0=performance.now();P=[];D=[];fired={};trail=[];}
function add(p){P.push(Object.assign({vx:0,vy:0,g:0,drag:1,life:0,max:.6,s:4,k:"glow",rot:R(0,6),vr:0},p))}
const C=()=>E[elem].c;
function impactT(){return style==="melee"?.42:style==="slash"?.5:elem==="foudre"?.5:.82}
// ---------- primitives
function lightningPath(x1,y1,x2,y2,j,n=12){const pts=[[x1,y1]];for(let i=1;i<n;i++){const t=i/n;pts.push([x1+(x2-x1)*t+R(-j,j)*.3,y1+(y2-y1)*t+R(-j,j)])}pts.push([x2,y2]);return pts}
function stroke(pts,w,col){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.lineWidth=w;x.strokeStyle=col;x.lineJoin="round";x.lineCap="round";x.stroke()}
function glow(px,py,r,col,a=1){if(r<=0)return;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.globalAlpha=Math.max(0,a);x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1}
function add2(fn){x.globalCompositeOperation="lighter";fn();x.globalCompositeOperation="source-over"}
/** Source de lumière de la frame : flaque colorée au sol + éclairage des cartes. */
function lamp(px,py,r,col,a){light={x:px,y:py,r,col,a};const h=Math.max(0,GY-py);add2(()=>{x.save();x.translate(px,GY+6);x.scale(1,.22);glow(0,0,r*(1.4-Math.min(1,h/260)*.6),col,a*(1-Math.min(.8,h/300)));x.restore()})}
function groundShadow(px,h,r,a=.5){const k=Math.min(1,h/220);x.save();x.translate(px,GY+5);x.scale(1,.2);x.globalAlpha=a*(1-k*.7);const g=x.createRadialGradient(0,0,0,0,0,r*(1+k));g.addColorStop(0,"rgba(0,0,0,.9)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(0,0,r*(1+k),0,7);x.fill();x.restore();x.globalAlpha=1}
function card(cx,cy,label,tint,ta){
  // ombre portée, poussée à l'opposé de la lumière
  const sh=light?Math.max(-60,Math.min(60,(cx-light.x)*.25*light.a)):0;
  x.save();x.translate(cx+sh*.5,GY+5);x.transform(1,0,-sh/40,1,0,0);x.scale(1,.18);const g0=x.createRadialGradient(0,0,0,0,0,62);g0.addColorStop(0,"rgba(0,0,0,.75)");g0.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g0;x.beginPath();x.arc(0,0,62,0,7);x.fill();x.restore();
  x.save();x.translate(cx,cy);
  const body=x.createLinearGradient(0,-68,0,68);body.addColorStop(0,"#38315a");body.addColorStop(1,"#1f1b31");x.fillStyle=body;x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.roundRect(-48,-68,96,136,10);x.fill();x.stroke();
  const art=x.createLinearGradient(0,-60,0,32);art.addColorStop(0,"#4a4278");art.addColorStop(1,"#2e2850");x.fillStyle=art;x.fillRect(-40,-60,80,92);
  x.fillStyle="#8b84b8";x.beginPath();x.arc(0,-24,16,0,7);x.fill();x.fillRect(-20,-6,40,34);x.fillStyle="rgba(0,0,0,.25)";x.fillRect(4,-6,16,34);x.beginPath();x.arc(0,-24,16,-1.4,1.4);x.fill();
  x.strokeStyle="rgba(255,255,255,.12)";x.lineWidth=1;x.beginPath();x.roundRect(-44,-64,88,128,8);x.stroke();
  x.fillStyle="#cfc8ff";x.font="600 11px sans-serif";x.textAlign="center";x.fillText(label,0,52,88);
  // lumière de contour côté source
  if(light&&light.a>.05){const dx=light.x-cx,dy=light.y-cy,d=Math.hypot(dx,dy)||1,str=light.a*Math.max(0,1-d/(light.r*3));if(str>.02){const lg=x.createLinearGradient(-dx/d*48,-dy/d*68,dx/d*48,dy/d*68);lg.addColorStop(0,"rgba(0,0,0,0)");lg.addColorStop(1,light.col);x.globalCompositeOperation="lighter";x.globalAlpha=Math.min(.75,str);x.fillStyle=lg;x.beginPath();x.roundRect(-48,-68,96,136,10);x.fill();x.globalAlpha=1;x.globalCompositeOperation="source-over"}}
  if(ta>0){x.globalAlpha=ta;x.fillStyle=tint;x.beginPath();x.roundRect(-48,-68,96,136,10);x.fill();x.globalAlpha=1}x.restore()}
function crescent(cx,cy,r,a0,a1,w,c){x.beginPath();x.arc(cx,cy,r,a0,a1);x.arc(cx+w*.5,cy-w*.2,r-w,a1,a0,true);x.closePath();x.fillStyle=c;x.fill()}
// ---------- marques au sol
function decal(k,px,s,max=2){D.push({k,x:px,s,life:0,max,seed:Array.from({length:12},()=>Math.random())})}
function drawDecals(dt){D=D.filter((d)=>{d.life+=dt;const a=Math.min(1,d.life*8)*(1-seg(d.life,d.max*.6,d.max));if(d.life>d.max)return false;const c=C();x.save();x.translate(d.x,GY+6);
  if(d.k==="scorch"||d.k==="burn"){x.save();x.scale(1,.22);const g=x.createRadialGradient(0,0,0,0,0,d.s);g.addColorStop(0,"rgba(10,5,5,.85)");g.addColorStop(.7,"rgba(30,15,10,.5)");g.addColorStop(1,"rgba(0,0,0,0)");x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(0,0,d.s,0,7);x.fill();x.restore();
    add2(()=>{for(let i=0;i<12;i++){const ang=d.seed[i]*6.28,r=d.s*.8*d.seed[(i+3)%12];const fl=.5+.5*Math.sin(d.life*30+i*7);if(d.k==="scorch")glow(Math.cos(ang)*r,Math.sin(ang)*r*.22,3+fl*3,c[1],a*(1-seg(d.life,.2,d.max)));else{x.globalAlpha=a*fl*(1-seg(d.life,.1,.9));stroke([[0,0],[Math.cos(ang)*r,Math.sin(ang)*r*.22]],1.5,c[1])}}})}
  if(d.k==="puddle"){x.scale(1,.2);x.globalAlpha=a*.75;const g=x.createRadialGradient(0,0,0,0,0,d.s);g.addColorStop(0,c[2]);g.addColorStop(1,"rgba(40,120,220,0)");x.fillStyle=g;x.beginPath();x.arc(0,0,d.s,0,7);x.fill();
    for(let i=0;i<3;i++){const k=(d.life*1.4+i/3)%1;x.globalAlpha=a*(1-k)*.8;x.strokeStyle=c[0];x.lineWidth=3;x.beginPath();x.arc(0,0,d.s*.2+d.s*.8*k,0,7);x.stroke()}}
  if(d.k==="crater"){x.globalAlpha=a;x.save();x.scale(1,.22);const g=x.createRadialGradient(0,0,0,0,0,d.s);g.addColorStop(0,"rgba(0,0,0,.8)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(0,0,d.s,0,7);x.fill();x.restore();
    for(let i=0;i<9;i++){const ang=d.seed[i]*6.28,r=d.s*(.6+.6*d.seed[(i+1)%12]);const pts=[[0,0]];for(let j=1;j<=4;j++)pts.push([Math.cos(ang)*r*j/4+(d.seed[(i+j)%12]-.5)*10,Math.sin(ang)*r*j/4*.22+(d.seed[(i+j+2)%12]-.5)*2]);stroke(pts,2,"rgba(0,0,0,.8)");x.globalAlpha=a*.5;stroke(pts.map(p=>[p[0],p[1]-1.5]),1,c[0]);x.globalAlpha=a}}
  if(d.k==="swirl"){x.scale(1,.25);x.globalAlpha=a*.6;for(let i=0;i<5;i++){x.strokeStyle=i%2?c[0]:"rgba(200,190,170,.7)";x.lineWidth=2;x.beginPath();const r=d.s*(.3+i*.15);x.arc(0,0,r,d.life*6+i,d.life*6+i+2.2);x.stroke()}}
  x.restore();x.globalAlpha=1;return true})}
// ---------- impacts par élément
function burst(px,py,power){
  const c=C();shake=Math.max(shake,elem==="terre"?15:elem==="foudre"?10:7);
  add({k:"ring",x:px,y:py,max:.3,s:10,grow:100,col:c[1]});
  add({k:"flash",x:px,y:py,max:.2,s:110,col:c[0]});
  if(elem==="feu"){decal("scorch",px,90,2.2);
    for(let i=0;i<50*power;i++){const a=R(0,6.28),v=R(60,340);add({k:"ember",x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,g:-140,drag:.92,max:R(.5,1.3),s:R(1.5,3.5),col:i%3?c[1]:c[0]})}
    for(let i=0;i<16;i++)add({k:"flame",x:px+R(-40,40),y:py+R(-10,40),vy:R(-140,-60),vx:R(-20,20),max:R(.5,.9),s:R(16,30)});
    for(let i=0;i<8;i++)add({k:"gflame",x:px+R(-70,70),y:GY,max:R(.6,1.1),s:R(10,20)});
    for(let i=0;i<12;i++)add({k:"smoke",x:px+R(-40,40),y:py-R(30,60),vx:R(-25,25),vy:R(-70,-30),drag:.98,vr:R(-1,1),max:R(1.3,2),s:R(30,50),col:"#4a3836",a0:.55})}
  if(elem==="eau"){decal("puddle",px,100,2.2);
    for(let i=0;i<70*power;i++){const a=R(-3.1,0),v=R(120,440);add({k:"drop",x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:900,drag:.99,max:R(.6,1.2),s:R(2,5),col:i%3?c[1]:c[0],ground:1})}
    for(let i=0;i<14;i++){const a=R(0,6.28);add({k:"bubble",x:px+Math.cos(a)*R(0,40),y:py+Math.sin(a)*R(0,40),vx:R(-30,30),vy:R(-60,-20),max:R(.6,1.1),s:R(2,6),col:c[0]})}
    add({k:"ring",x:px,y:py+40,max:.6,s:20,grow:180,col:c[0],flat:.3});
    for(let i=0;i<10;i++)add({k:"smoke",x:px+R(-50,50),y:py+R(-30,30),vx:R(-40,40),vy:R(-30,0),drag:.97,vr:R(-1,1),max:R(.9,1.4),s:R(34,56),col:"#bfeaff",a0:.5})}
  if(elem==="foudre"){decal("burn",px,80,1.8);
    for(let i=0;i<44*power;i++){const a=R(0,6.28),v=R(200,650);add({k:"spark",x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:500,drag:.9,max:R(.3,.8),s:2,col:i%2?c[0]:c[1],ground:2})}
    add({k:"crackle",x:px,y:py,max:.8,s:70});
    for(let i=0;i<6;i++)add({k:"smoke",x:px+R(-30,30),y:py+R(-20,40),vy:R(-50,-20),drag:.98,vr:R(-1,1),max:R(1,1.5),s:R(24,40),col:"#4a4560",a0:.7})}
  if(elem==="air"){decal("swirl",px,110,1.6);add({k:"tornado",x:px,y:py,max:1,s:70});
    for(let i=0;i<26*power;i++){const a=R(0,6.28);add({k:"streak",x:px+Math.cos(a)*R(20,60),y:py+Math.sin(a)*R(10,50),vx:-Math.sin(a)*R(200,400),vy:Math.cos(a)*R(100,200),drag:.92,max:R(.3,.6),s:R(14,30),col:c[0]})}
    for(let i=0;i<14;i++)add({k:"leaf",x:px+R(-30,30),y:py+R(-20,30),vx:R(-180,180),vy:R(-280,-80),g:220,drag:.97,vr:R(-12,12),max:R(1,1.6),s:R(4,7),col:i%2?c[2]:"#c9b26a"});
    for(let i=0;i<10;i++)add({k:"smoke",x:px+R(-70,70),y:GY-R(0,20),vx:R(-120,120),vy:R(-40,-5),drag:.95,vr:R(-3,3),max:R(.8,1.3),s:R(26,44),col:"#b8ab95",a0:.45})}
  if(elem==="terre"){decal("crater",px,110,2.4);
    for(let i=0;i<26*power;i++){const a=R(-2.9,-.25),v=R(160,480);add({k:"chunk",x:px+R(-30,30),y:GY-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:1100,max:R(.9,1.5),s:R(4,12),vr:R(-10,10),col:c[i%3+1],ground:3})}
    for(let i=0;i<16;i++)add({k:"smoke",x:px+R(-90,90),y:GY-R(0,30),vx:R(-90,90),vy:R(-50,-10),drag:.96,vr:R(-1,1),max:R(1.1,1.8),s:R(36,64),col:"#a88a62",a0:.7})}
}
// ---------- particules
function drawP(p,dt){p.life+=dt;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const k=p.life/p.max,a=1-k;if(k>=1)return false;
