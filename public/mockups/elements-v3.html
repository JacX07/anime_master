<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foudre bleue et terre — maquette</title><style>
:root{--ink:#e8e6f0;--quiet:#9a96ad;--line:#2e2a3d;--plate:#1b1826;font-family:'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;padding:12px;color:var(--ink);background:#0e0c16}main{max-width:1000px;margin:0 auto;display:grid;gap:12px}
h1{font-size:16px;margin:0}h2{font-size:14px;margin:6px 0 0}p{margin:0;font-size:12px;color:var(--quiet);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{border:1px solid var(--line);border-radius:10px;background:var(--plate);overflow:hidden;cursor:pointer}
.cell canvas{display:block;width:100%;height:auto;background:radial-gradient(120% 90% at 50% 0%,#2a2547,#120f1d 70%)}
.cell div{padding:8px 10px}.cell h3{margin:0 0 3px;font-size:13px}
button{font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--plate);color:var(--ink);cursor:pointer;width:max-content}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Foudre bleue et terre plus travaillée</h1>
<p>Clique sur une case pour la rejouer. Les durées et la position de l'impact restent celles du jeu actuel.</p>
<button id="all">↻ Tout rejouer</button>
<h2>Foudre — trois bleus</h2><div class="grid" id="g1"></div>
<h2>Terre — trois façons de faire sortir la roche</h2><div class="grid" id="g2"></div>
</main><script>
const R=(a,b)=>a+Math.random()*(b-a),seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),eo=v=>1-(1-v)**3,INK="#151a36";
const W=450,H=240,GY=190,A={x:90,y:120},B={x:340,y:120},CW=80,CH=110,T=.5;
const FZ={fa:["#ffffff","#8fe3ff","#2f9bff","#16337d"],fb:["#f4f0ff","#9db4ff","#4a5cff","#2a1a7a"],fc:["#ffffff","#c9f6ff","#46d8ff","#0b4f8a"]};
const TE=["#f3dcaa","#bb8b52","#7a5530","#33220f"];
const V=[
 ["fa","g1","Foudre A — Bleu électrique","Bleu vif à cœur blanc, halo bleu foncé. Le plus proche de l'éclair classique."],
 ["fb","g1","Foudre B — Bleu indigo","Plus sombre et violacé, halo profond. Contraste fort sur les décors clairs."],
 ["fc","g1","Foudre C — Cyan glacé","Cyan très clair, presque blanc. Le plus lumineux, un peu froid."],
 ["ta","g2","Terre A — Piliers","Cinq colonnes de basalte à facettes sortent l'une après l'autre sous la cible, restent un instant puis s'effondrent en blocs."],
 ["tb","g2","Terre B — Pointes en rafale","Une rangée de pointes jaillit depuis l'attaquant jusqu'à la cible, de plus en plus hautes. Les fissures brillent d'orange à la base."],
 ["tc","g2","Terre C — Éboulis","Des rochers se détachent du sol, tournent autour de la cible puis s'abattent d'un coup dessus."],
];
const S={};
for(const [id,g,title,desc] of V){const d=document.createElement("div");d.className="cell";d.innerHTML=`<canvas width="${W}" height="${H}"></canvas><div><h3>${title}</h3><p>${desc}</p></div>`;document.getElementById(g).append(d);S[id]={x:d.firstChild.getContext("2d"),t0:0,P:[]};d.onclick=()=>reset(id)}
function reset(id){const s=S[id];s.t0=performance.now()+200;s.P=[];s.ph={};s.bolt=null;s.bt=-1;
 if(id==="ta")s.cols=[[-64,70,30],[-32,112,34],[0,140,38],[32,100,34],[64,60,30]].map(([dx,h,w],j)=>({dx,h,w,d:j*.05+R(0,.02),s:R(.7,1.3)}));
 if(id==="tb")s.sp=Array.from({length:7},(_,i)=>({x:A.x+62+i*(B.x-A.x-62)/6,h:36+i*15,w:24+i*3.5,d:i*.045,lean:R(-.12,.12)}));
 if(id==="tc")s.rk=Array.from({length:7},(_,i)=>({x0:B.x+(i-3)*30+R(-6,6),r:R(10,17),a:i*.9,spin:R(-6,6),seed:R(0,9),rise:R(70,115)}));}
document.getElementById("all").onclick=()=>V.forEach(v=>reset(v[0]));
function card(x,cx,cy,col,hit){x.save();x.translate(cx+(hit?R(-2,2):0),cy);x.fillStyle="#2b2745";x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.roundRect(-CW/2,-CH/2,CW,CH,8);x.fill();x.stroke();x.fillStyle="#3c3760";x.fillRect(-CW/2+8,-CH/2+8,CW-16,CH*.5);x.fillStyle="#1c1930";x.fillRect(-CW/2+8,CH/2-30,CW-16,8);x.fillRect(-CW/2+8,CH/2-18,CW-30,6);x.restore()}
function glow(x,px,py,r,col,a=1){const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1}
function line(x,pts,w,col,a=1){x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=w;x.lineJoin="round";x.lineCap="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.globalAlpha=1}
function rock(x,cx,cy,r,rot,seed,pal){x.save();x.translate(cx,cy);x.rotate(rot);const n=8,pts=[];for(let i=0;i<n;i++){const a=i/n*6.283,k=.7+.3*Math.abs(Math.sin(seed*3+i*1.7));pts.push([Math.cos(a)*r*k,Math.sin(a)*r*k*.85])}
 x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=pal[2];x.fill();
 x.save();x.clip();x.fillStyle=pal[1];x.beginPath();x.moveTo(pts[5][0],pts[5][1]);x.lineTo(pts[6][0],pts[6][1]);x.lineTo(pts[7][0],pts[7][1]);x.lineTo(pts[0][0],pts[0][1]);x.lineTo(0,0);x.fill();
 x.fillStyle="rgba(25,12,0,.45)";x.beginPath();x.moveTo(pts[1][0],pts[1][1]);x.lineTo(pts[2][0],pts[2][1]);x.lineTo(pts[3][0],pts[3][1]);x.lineTo(0,0);x.fill();x.restore();
 x.lineWidth=2.5;x.strokeStyle=INK;x.stroke();x.strokeStyle=pal[0];x.lineWidth=1.2;x.beginPath();x.moveTo(pts[6][0],pts[6][1]);x.lineTo(pts[7][0],pts[7][1]);x.stroke();x.restore()}
function add(s,p){s.P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,l:0,m:.6,s:3,col:"#fff",k:"sp",rot:0,vr:0,seed:R(0,9),dr:1},p))}
function parts(s,x,dt,pal){s.P=s.P.filter(p=>{p.l+=dt;if(p.l<0)return true;const u=p.l/p.m;if(u>=1)return false;p.vx*=p.dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.rot+=p.vr*dt;
 if(p.k==="ch"&&p.y>GY){p.y=GY;p.vy*=-.25;p.vx*=.5;p.vr*=.4}
 if(p.k==="sp"){x.globalCompositeOperation="lighter";x.globalAlpha=1-u;line(x,[[p.x,p.y],[p.x-p.vx*.03,p.y-p.vy*.03]],p.s,p.col);x.globalAlpha=1;x.globalCompositeOperation="source-over"}
 else if(p.k==="ch"){x.globalAlpha=1-u*u;rock(x,p.x,p.y,p.s,p.rot,p.seed,pal);x.globalAlpha=1}
 else if(p.k==="du"){x.globalAlpha=(1-u)*.5;const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*(1+u));g.addColorStop(0,p.col);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.s*(1+u),0,7);x.fill();x.globalAlpha=1}
 else if(p.k==="ring"){x.globalAlpha=(1-u)*.8;x.strokeStyle=p.col;x.lineWidth=3*(1-u)+.5;x.beginPath();x.ellipse(p.x,p.y,10+eo(u)*p.s,(10+eo(u)*p.s)*.28,0,0,7);x.stroke();x.globalAlpha=1}
 return true})}
function zig(a,b,n,j){const pts=[[a[0],a[1]]],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;for(let i=1;i<n;i++){const f=i/n,o=R(-j,j);pts.push([a[0]+dx*f+nx*o,a[1]+dy*f+ny*o])}pts.push([b[0],b[1]]);return pts}
/* ---------- foudre */
function foudre(id,t,s,x,pal){
 const tc=B.x-CW/2+4;
 if(t>T-.12&&t<T)glow(x,A.x+CW/2,A.y,26*seg(t,T-.12,T),pal[1],.7);
 if(t>=T&&!s.ph.hit){s.ph.hit=1;for(let i=0;i<30;i++){const a=R(0,6.28),v=R(160,520);add(s,{k:"sp",x:B.x,y:B.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:400,dr:.93,m:R(.25,.6),s:2,col:i%2?pal[0]:pal[1]})}
  add(s,{k:"ring",x:B.x,y:B.y+CH/2,m:.4,s:80,col:pal[1]})}
 if(t>=T&&t<T+.32){
  if(s.bt<0||t-s.bt>.05){s.bt=t;const a=[A.x+CW/2,A.y-6],b=[B.x,B.y];s.bolt=zig(a,b,9,16);s.br=[];for(let k=0;k<2;k++){const i=2+Math.floor(R(0,5)),o=s.bolt[i];s.br.push(zig(o,[o[0]+R(20,50),o[1]+R(-50,50)],4,8))}
   s.cr=Array.from({length:3},()=>zig([B.x+R(-CW/2,CW/2),B.y+R(-CH/2,CH/2)],[B.x+R(-CW/2,CW/2),B.y+R(-CH/2,CH/2)],5,5))}
  const al=1-seg(t,T+.14,T+.32);x.globalCompositeOperation="lighter";
  for(const pts of [s.bolt,...s.br]){line(x,pts,12,pal[3],.4*al);line(x,pts,7,pal[2],.65*al);line(x,pts,3.5,pal[1],al);line(x,pts,1.5,pal[0],al)}
  glow(x,B.x,B.y,110*(1-seg(t,T,T+.22)),pal[1],.9*(1-seg(t,T,T+.22)));glow(x,A.x+CW/2,A.y,20,pal[1],.8*al);
  for(const pts of s.cr)line(x,pts,1.5,pal[0],al);
  x.fillStyle=pal[2];x.globalAlpha=.3*al;x.beginPath();x.roundRect(B.x-CW/2,B.y-CH/2,CW,CH,8);x.fill();x.globalAlpha=1;x.globalCompositeOperation="source-over"}
}
/* ---------- terre */
function terreA(t,s,x){
 for(const c of s.cols){const k=seg(t,T-.1+c.d,T+.08+c.d);if(k<=0)continue;const out=t>T+.55+c.d;
  if(!c.up){c.up=1;add(s,{k:"du",x:B.x+c.dx,y:GY,vy:-20,vx:R(-30,30),m:.6,s:24,col:"#a88a62",dr:.97});add(s,{k:"ring",x:B.x+c.dx,y:GY,m:.35,s:34,col:TE[0]})}
  if(out){if(!c.gone){c.gone=1;for(let i=0;i<8;i++)add(s,{k:"ch",x:B.x+c.dx+R(-c.w/2,c.w/2),y:GY-R(5,c.h),vx:R(-80,80),vy:R(-120,0),g:1000,m:R(.7,1.1),s:R(5,9),vr:R(-8,8)});add(s,{k:"du",x:B.x+c.dx,y:GY-20,m:.7,s:30,col:"#a88a62",dr:.97})}continue}
  const ease=1+2.70158*(k-1)**3+1.70158*(k-1)**2,h=c.h*Math.max(.01,ease),w=c.w,tr=t>T+.45+c.d?R(-1.5,1.5):0;
  x.save();x.translate(B.x+c.dx+tr,GY);
  // corps : trois faces (gauche claire, centre, droite sombre)
  x.fillStyle=TE[2];x.fillRect(-w/2,-h,w,h);
  x.fillStyle=TE[1];x.fillRect(-w/2,-h,w*.34,h);
  x.fillStyle="rgba(25,12,0,.5)";x.fillRect(w*.18,-h,w*.32,h);
  // dessus biseauté
  x.fillStyle=TE[0];x.beginPath();x.moveTo(-w/2,-h);x.lineTo(-w*.2,-h-10*c.s);x.lineTo(w*.25,-h-5*c.s);x.lineTo(w/2,-h);x.closePath();x.fill();
  x.strokeStyle="rgba(40,22,8,.5)";x.lineWidth=1.3;for(let i=1;i<6;i++){x.beginPath();x.moveTo(-w/2,-h*i/6);x.lineTo(w/2,-h*i/6+2);x.stroke()}
  x.lineWidth=2.5;x.strokeStyle=INK;x.beginPath();x.moveTo(-w/2,0);x.lineTo(-w/2,-h);x.lineTo(-w*.2,-h-10*c.s);x.lineTo(w*.25,-h-5*c.s);x.lineTo(w/2,-h);x.lineTo(w/2,0);x.stroke();
  x.restore();}
 if(t>T&&!s.ph.hit){s.ph.hit=1;add(s,{k:"ring",x:B.x,y:GY,m:.5,s:90,col:TE[0]})}
}
function terreB(t,s,x){
 for(const p of s.sp){const t0=T-.27+p.d,k=seg(t,t0,t0+.12);if(k<=0)continue;const out=t>T+.45+p.d;
  if(!p.up){p.up=1;add(s,{k:"du",x:p.x,y:GY,vy:-25,vx:R(-20,20),m:.5,s:16+p.h*.2,col:"#a88a62",dr:.97});for(let i=0;i<3;i++)add(s,{k:"ch",x:p.x,y:GY-4,vx:R(-90,90),vy:R(-220,-100),g:1000,m:.6,s:R(3,5),vr:R(-8,8)})}
  if(out){if(!p.gone){p.gone=1;for(let i=0;i<5;i++)add(s,{k:"ch",x:p.x+R(-p.w/2,p.w/2),y:GY-R(5,p.h),vx:R(-60,60),vy:R(-90,0),g:1000,m:R(.6,.9),s:R(4,7),vr:R(-8,8)})}continue}
  const ease=1+2.2*(k-1)**3+1.2*(k-1)**2,h=p.h*Math.max(.01,ease),w=p.w;
  // fissure incandescente à la base
  x.globalCompositeOperation="lighter";glow(x,p.x,GY,w*.9,"#ff9a2e",.5*(1-seg(t,t0+.1,t0+.35)));x.globalCompositeOperation="source-over";
  x.save();x.translate(p.x,GY);x.rotate(p.lean);
  const J=[[-w/2,0],[-w*.42,-h*.45],[-w*.2,-h*.62],[w*.05,-h],[w*.22,-h*.58],[w*.45,-h*.4],[w/2,0]];
  x.beginPath();J.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fillStyle=TE[1];x.fill();
  x.save();x.clip();x.fillStyle="rgba(25,12,0,.55)";x.beginPath();x.moveTo(w*.05,-h);x.lineTo(w*.22,-h*.58);x.lineTo(w*.45,-h*.4);x.lineTo(w/2,0);x.lineTo(w*.03,0);x.fill();
  x.fillStyle=TE[0];x.globalAlpha=.55;x.beginPath();x.moveTo(-w*.42,-h*.45);x.lineTo(-w*.2,-h*.62);x.lineTo(w*.05,-h);x.lineTo(-w*.02,-h*.5);x.fill();x.globalAlpha=1;x.restore();
  x.lineWidth=2.5;x.strokeStyle=INK;x.stroke();line(x,[[-w*.05,-h*.1],[w*.02,-h*.3],[-w*.04,-h*.5]],1.3,INK);x.restore();}
 const last=s.sp[6];if(t>T&&!s.ph.hit){s.ph.hit=1;add(s,{k:"ring",x:B.x,y:GY,m:.5,s:80,col:TE[0]})}
}
function terreC(t,s,x){
 const up0=T-.5,slam=T-.06;
 for(const r of s.rk){
  const kUp=eo(seg(t,up0,T-.14)),kSl=seg(t,slam,T)**2,out=t>T+.18;
  if(t>up0&&!r.up){r.up=1;add(s,{k:"du",x:r.x0,y:GY,vy:-15,m:.5,s:18,col:"#a88a62",dr:.97})}
  if(t<up0||out){if(out&&!r.gone){r.gone=1;for(let i=0;i<3;i++)add(s,{k:"ch",x:B.x+R(-20,20),y:B.y+R(-10,30),vx:R(-160,160),vy:R(-200,-60),g:1100,m:R(.7,1),s:r.r*R(.5,.8),vr:R(-9,9)})}continue}
  const ang=r.a+t*5,orb=(1-kSl)*26,px=r.x0+(B.x-r.x0)*kSl+Math.cos(ang)*orb,hover=B.y-CH/2-r.rise*.55,py0=GY-(GY-hover)*kUp,py=py0+(B.y-py0)*kSl+Math.sin(ang)*orb*.4;
  rock(x,px,py,r.r,t*r.spin,r.seed,TE)}
 if(t>=T&&!s.ph.hit){s.ph.hit=1;for(let i=0;i<4;i++)add(s,{k:"du",x:B.x+R(-40,40),y:GY-R(0,10),vx:R(-60,60),vy:R(-30,-5),m:.8,s:R(26,38),col:"#a88a62",dr:.96});add(s,{k:"ring",x:B.x,y:GY,m:.5,s:95,col:TE[0]});add(s,{k:"ring",x:B.x,y:B.y,m:.3,s:55,col:"#fff"})}
}
function frame(id,now){const s=S[id],x=s.x,t=(now-s.t0)/1000;x.clearRect(0,0,W,H);
 x.fillStyle="#1a1626";x.fillRect(0,GY,W,H-GY);x.strokeStyle="rgba(255,255,255,.12)";x.beginPath();x.moveTo(0,GY);x.lineTo(W,GY);x.stroke();
 const hit=t>T&&t<T+.2;card(x,A.x,A.y,"#6f65b8",false);
 if(id[0]==="t"){ // terre : la roche passe derrière la carte pour les colonnes et pointes, devant pour l'éboulis
  card(x,B.x,B.y,"#6f65b8",hit);
  if(id==="ta")terreA(t,s,x);if(id==="tb")terreB(t,s,x);if(id==="tc")terreC(t,s,x);
 }else{card(x,B.x,B.y,"#6f65b8",hit);foudre(id,t,s,x,FZ[id])}
 parts(s,x,1/60,TE);
 if(t>1.6)reset(id)}
V.forEach(v=>reset(v[0]));
(function loop(now){V.forEach(v=>frame(v[0],now));requestAnimationFrame(loop)})(performance.now());
</script></body></html>
