<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Barre de navigation escamotable</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e0f;--panel:#111514;--gold:#c4a76d;--gold-l:#d5bb7f;--txt:#e9e5dc;--muted:#717772}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 500px at 50% -10%,#1d1a12,transparent 60%),var(--bg);color:var(--txt);font:400 13px/1.5 "DM Sans",sans-serif;overflow-x:hidden}
/* sélecteur de variante */
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;display:flex;gap:6px;padding:6px;background:#151918f2;border-radius:7px;box-shadow:0 14px 34px #000a}
.switch button{background:none;border:0;color:var(--muted);font:500 11px "DM Sans";letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent}
.switch button[aria-pressed=true]{color:var(--txt);border-bottom-color:var(--gold)}
.note{position:fixed;left:16px;bottom:70px;z-index:200;max-width:360px;padding:10px 12px;background:#151918f2;border-radius:6px;color:#b4b2aa;font-size:12px;box-shadow:0 10px 26px #0009}
.note b{color:var(--gold-l);font:500 13px Cinzel}

/* ---------- barre complète ---------- */
.bar{position:fixed;inset:0 0 auto;z-index:100;height:76px;display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:20px;padding:0 20px;background:linear-gradient(180deg,#0b0e0ff7,#0b0e0fe6);backdrop-filter:blur(10px);box-shadow:0 1px 0 #c4a76d33,0 18px 40px #0008;transition:transform .32s cubic-bezier(.2,.9,.2,1),opacity .25s}
.logo{font:600 22px Cinzel;color:var(--gold-l);letter-spacing:.04em;line-height:1}.logo small{display:block;font-size:9px;letter-spacing:.5em;color:var(--gold)}
.tabs{display:flex;gap:4px;justify-content:space-evenly}
.tabs a{color:#8b8f89;text-decoration:none;font:500 11px Cinzel;letter-spacing:.16em;text-transform:uppercase;padding:10px 6px;border-bottom:2px solid transparent}
.tabs a.on{color:var(--gold-l);border-bottom-color:var(--gold)}
.tabs a:hover{color:var(--txt)}
.play{padding:12px 30px;background:linear-gradient(180deg,#e2c98c,#b8964f);color:#1a1408;font:600 13px Cinzel;letter-spacing:.2em;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);border:0;cursor:pointer}
.me{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#2b2f2c,#0f1211);box-shadow:0 0 0 2px var(--gold);font:600 14px Cinzel;color:#f0dca0}
.me div{font-size:11px;line-height:1.3}.me b{font:600 13px Cinzel}.me .w{color:var(--gold-l);font-weight:700}

/* état caché */
body.hide .bar{transform:translateY(calc(-100% - 2px))}
body.hide.reveal .bar{transform:none}
/* Variante A : caché, un fil doré + un petit onglet signalent la barre */
.hint{position:fixed;top:0;left:0;right:0;z-index:99;height:3px;background:linear-gradient(90deg,transparent,#c4a76d66 30%,#d5bb7f 50%,#c4a76d66 70%,transparent);opacity:0;transition:opacity .3s}
.hint i{position:absolute;left:50%;top:0;transform:translateX(-50%);padding:2px 14px 4px;background:#151918f2;border-radius:0 0 6px 6px;color:var(--gold-l);font:500 10px "DM Sans";letter-spacing:.2em;text-transform:uppercase;box-shadow:0 6px 14px #0008;white-space:nowrap}
body.vA.hide:not(.reveal) .hint{opacity:1}
/* Variante B : mini-barre fine permanente, la barre complète se déploie au survol */
.mini{position:fixed;inset:0 0 auto;z-index:99;height:38px;display:none;align-items:center;gap:18px;padding:0 16px;background:#0b0e0fe6;backdrop-filter:blur(10px);box-shadow:0 1px 0 #c4a76d33;transition:opacity .25s}
.mini .logo{font-size:15px}.mini .logo small{display:none}
.mini .crumb{color:var(--gold-l);font:500 11px Cinzel;letter-spacing:.16em;text-transform:uppercase}
.mini .play{padding:6px 18px;font-size:11px}
.mini .sp{flex:1}
.mini .w{color:var(--gold-l);font-weight:700;font-size:12px}
.mini .av{width:26px;height:26px;font-size:10px}
body.vB .mini{display:flex}
body.vB.reveal .mini{opacity:0}
/* zone de détection en haut */
.zone{position:fixed;top:0;left:0;right:0;height:14px;z-index:150}
body.vB .zone{height:38px}
body.reveal .zone{pointer-events:none}

/* ---------- contenu factice ---------- */
main{padding:24px 4.3vw 120px;transition:padding .32s}
body:not(.hide) main{padding-top:100px}
body.vB main{padding-top:56px}
body.vA.hide main{padding-top:24px}
h1{font:500 clamp(22px,2.2vw,30px) Cinzel;margin:0 0 4px}
.sub{color:#777d78;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{aspect-ratio:5/7;border-radius:8px;background:linear-gradient(160deg,#1c2220,#0f1312);box-shadow:0 0 0 1px #ff3b4a66,0 10px 22px #0008;position:relative;overflow:hidden}
.card:nth-child(3n){box-shadow:0 0 0 1px #f59e0b66,0 10px 22px #0008}.card:nth-child(4n){box-shadow:0 0 0 1px #a855f766,0 10px 22px #0008}
.card::after{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:8px;border-radius:2px;background:#2a302e}
.count{position:fixed;right:16px;top:50%;z-index:120;transform:translateY(-50%);padding:8px 10px;background:#151918f2;border-radius:6px;font-size:11px;color:#b4b2aa;text-align:center}
.count b{display:block;font:600 22px Cinzel;color:var(--gold-l)}
@media (max-width:900px){.tabs{display:none}.bar{grid-template-columns:auto 1fr auto auto}.note{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body class="vA hide">
<div class="zone" id="zone"></div>
<div class="hint"><i>◆ Menu</i></div>
<div class="mini"><span class="logo">ANIMA</span><span class="crumb">Collection</span><span class="sp"></span><button class="play">JOUER</button><span class="w">◎ 1 725 · ◆ 182</span><span class="av">EM</span></div>
<header class="bar" id="bar">
  <div class="logo">ANIMA<small>CLASH</small></div>
  <nav class="tabs"><a href="#">Accueil</a><a href="#" class="on">Collection</a><a href="#">Inventaire</a><a href="#">Squads</a></nav>
  <button class="play">JOUER</button>
  <nav class="tabs"><a href="#">Quêtes</a><a href="#">Marché</a><a href="#">Social</a><a href="#">Succès</a></nav>
  <div class="me"><span class="av">EM</span><div><b>EmpBr</b><br><span class="w">◎ 1 725</span> · ◆ 182</div></div>
</header>
<main>
  <h1>Ma collection</h1>
  <p class="sub">Contenu factice : regarde combien de cartes tiennent à l'écran selon la variante.</p>
  <div class="grid" id="grid"></div>
</main>
<div class="count"><b id="vis">0</b>px pour<br>le contenu</div>
<div class="note" id="note"></div>
<div class="switch" role="group" aria-label="Variante">
  <button data-v="vA" aria-pressed="true">A · Escamotable</button>
  <button data-v="vB" aria-pressed="false">B · Mini-barre</button>
  <button data-v="vC" aria-pressed="false">Actuel</button>
</div>
<script>
const notes={
 vA:"<b>A · Escamotable</b><br>La barre est cachée. Un fil doré et un petit onglet « ◆ Menu » en haut signalent qu'elle existe. Elle descend quand la souris touche le haut de l'écran (14 px), ou au clavier (Tab), et remonte 0,6 s après que la souris l'a quittée. Sur téléphone : elle réapparaît quand on remonte la page.",
 vB:"<b>B · Mini-barre</b><br>Une bande fine de 38 px reste visible : logo, page courante, JOUER, Ryō, cristaux, avatar. Au survol, la barre complète se déploie par-dessus. On garde l'essentiel sous la main tout en gagnant ~40 px.",
 vC:"<b>Actuel</b><br>Barre de 76 px toujours affichée, pour comparer."};
const body=document.body,zone=document.getElementById("zone"),bar=document.getElementById("bar");
let t=0;
const show=()=>{clearTimeout(t);body.classList.add("reveal")};
const hide=()=>{clearTimeout(t);t=setTimeout(()=>body.classList.remove("reveal"),600)};
zone.addEventListener("pointerenter",show);zone.addEventListener("pointerleave",e=>{if(e.clientY>14)hide()});
bar.addEventListener("pointerenter",show);bar.addEventListener("pointerleave",hide);
document.querySelector(".mini").addEventListener("pointerenter",show);
bar.addEventListener("focusin",show);bar.addEventListener("focusout",hide);
// téléphone : réapparaît quand on remonte
let lastY=scrollY;addEventListener("scroll",()=>{if(matchMedia("(pointer:coarse)").matches){if(scrollY<lastY-8)show();else if(scrollY>lastY+8)hide();}lastY=scrollY;},{passive:true});
document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".switch button").forEach(x=>x.setAttribute("aria-pressed",x===b));
 body.className=b.dataset.v+(b.dataset.v==="vC"?"":" hide");document.getElementById("note").innerHTML=notes[b.dataset.v];setTimeout(count,400);});
document.getElementById("note").innerHTML=notes.vA;
document.getElementById("grid").innerHTML=Array.from({length:60},()=>'<div class="card"></div>').join("");
function count(){const v=body.classList.contains("vC")?76:body.classList.contains("vB")?38:0;document.getElementById("vis").textContent=innerHeight-v;}
addEventListener("load",count);addEventListener("resize",count);addEventListener("scroll",count,{passive:true});
</script>
</body></html>
